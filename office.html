<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESM Office</title>
<meta name="theme-color" content="#0b2a5b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Centre Office">
<link rel="apple-touch-icon" href="office-icon.png">
<link rel="icon" href="office-icon.png">
<link rel="manifest" href="office.webmanifest">
<style>
:root{
  --ink:#1d2433; --quiet:#667085; --line:#d9dee8; --bg:#f4f6fa; --card:#ffffff;
  --brand:#14325c; --brand2:#1f4a85; --accent:#f2b705; --accentInk:#3a2c00;
  --bracket:#b8c2d4; --good:#1d7a46; --goodBg:#e3f4ea; --warn:#8a5a00; --warnBg:#fff3d1; --bad:#a3241b; --badBg:#fde7e5;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:84px}

/* HEADER */
.band{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:18px 16px 26px}
.band .top{display:flex;align-items:center;gap:12px}
.logo{flex:0 0 52px;height:52px;border-radius:12px;border:2px dashed rgba(255,255,255,.55);
  display:flex;align-items:center;justify-content:center;font-size:11px;text-align:center;line-height:1.1;opacity:.9}
.band h1{margin:0;font-size:22px;line-height:1.15}
.band .sub{margin-top:3px;font-size:13px;opacity:.85}
.pill{display:inline-block;margin-top:14px;background:var(--accent);color:var(--accentInk);
  font-weight:700;font-size:12px;padding:5px 12px;border-radius:999px}
.testpill{display:inline-block;margin-left:6px;background:#fff;color:var(--bad);font-weight:700;font-size:11px;padding:4px 9px;border-radius:999px}

/* SMALL HEADER (inner pages) */
.mini{background:var(--brand);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.mini .back{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:10px;padding:7px 12px;font-weight:600;cursor:pointer;white-space:nowrap;flex:0 0 auto}
.mini .t{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* TWO SQUARES */
.squares{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px;margin-top:-14px;position:relative}
.sq{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 12px;text-align:center;
  box-shadow:0 2px 8px rgba(20,50,92,.08);cursor:pointer}
.sq .ic{font-size:26px}
.sq b{display:block;margin-top:6px;font-size:15px}
.sq span{display:block;font-size:12px;color:var(--quiet);margin-top:2px}

/* SECTIONS */
.sec{padding:0 16px;margin-top:22px}
.sec h2{font-size:16px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.sec h2 .n{background:var(--brand);color:#fff;font-size:11px;width:22px;height:22px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center}
.bracket{border:2px dashed var(--bracket);border-radius:14px;padding:14px;background:rgba(255,255,255,.55)}
.bracket .what{font-size:13px;color:var(--quiet);margin:0 0 10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.ph{flex:0 0 132px;height:96px;border-radius:10px;background:repeating-linear-gradient(45deg,#e8ecf3,#e8ecf3 8px,#f1f4f9 8px,#f1f4f9 16px);
  border:1px solid var(--line);display:flex;align-items:flex-end;padding:8px;font-size:11px;color:var(--quiet)}
.fuel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fuel div{background:#eef1f6;border:1px solid var(--line);border-radius:8px;padding:10px 6px;text-align:center;font-size:11px;color:var(--quiet)}
.fuel b{display:block;font-size:16px;color:var(--ink);margin-top:2px}
.li{height:38px;border-radius:8px;background:#eef1f6;border:1px solid var(--line);margin-top:8px;
  display:flex;align-items:center;padding:0 12px;font-size:12px;color:var(--quiet)}

/* SPECIAL CARDS */
.sp{flex:0 0 200px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;
  display:flex;flex-direction:column;gap:4px}
.sp .shop{font-size:11px;color:var(--quiet);text-transform:uppercase;letter-spacing:.04em}
.sp .ti{font-weight:700;font-size:15px;line-height:1.2}
.sp .de{font-size:12px;color:var(--quiet);line-height:1.3}
.sp .bt{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:6px}
.price{background:var(--accent);color:var(--accentInk);font-weight:800;font-size:13px;padding:3px 9px;border-radius:999px}
.until{font-size:11px;color:var(--quiet)}

/* SHOP LIST */
.shoprow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:11px 12px;margin-top:8px;cursor:pointer}
.shoprow:first-child{margin-top:0}
.av{flex:0 0 38px;height:38px;border-radius:10px;background:#e7edf7;color:var(--brand);font-weight:800;
  display:flex;align-items:center;justify-content:center;font-size:14px}
.shoprow .nm{font-weight:600;font-size:15px}
.shoprow .mt{font-size:12px;color:var(--quiet);margin-top:1px}
.shoprow .go{margin-left:auto;color:var(--quiet);font-size:18px}
.tag{font-size:11px;font-weight:700;background:var(--goodBg);color:var(--good);padding:2px 7px;border-radius:999px;margin-left:6px}

/* FORMS + BUTTONS */
.pad{padding:16px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
label:first-child{margin-top:0}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;font-size:16px}
textarea{min-height:70px;resize:vertical}
.hint{font-size:12px;color:var(--quiet);margin-top:4px}
.b{display:inline-block;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;
  font-weight:600;font-size:14px;cursor:pointer;text-align:center}
.b.main{background:var(--brand);border-color:var(--brand);color:#fff}
.b.ok{background:var(--good);border-color:var(--good);color:#fff}
.b.no{color:var(--bad);border-color:#efc4bf}
.b.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.b.wide{display:block;width:100%;margin-top:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.msg{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:14px}
.msg.ok{background:var(--goodBg);color:var(--good)}
.msg.err{background:var(--badBg);color:var(--bad)}
.msg:empty{display:none}
.ask{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--warnBg);color:var(--warn);font-size:14px}
.st{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.st.pending{background:var(--warnBg);color:var(--warn)}
.st.approved{background:var(--goodBg);color:var(--good)}
.st.rejected{background:var(--badBg);color:var(--bad)}
.st.ended{background:#eceff4;color:var(--quiet)}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.item .ti{font-weight:700}
.item .mt{font-size:12px;color:var(--quiet);margin-top:3px}
.item .de{font-size:13px;margin-top:5px}
.code{font-family:ui-monospace,Consolas,monospace;font-weight:700;letter-spacing:.08em;background:#eef1f6;padding:2px 7px;border-radius:6px}
.tabs{display:flex;gap:6px;padding:12px 16px 0;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer}
.tab.on{background:var(--brand);border-color:var(--brand);color:#fff}
.cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:999px;background:var(--accent);color:var(--accentInk);font-size:11px;text-align:center}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:10px}
.cats::-webkit-scrollbar{display:none}
/* e5: the front door ("come shopping") and logos */
.lg{flex:0 0 auto;border-radius:12px;overflow:hidden;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.lg img{width:100%;height:100%;object-fit:contain}
.lg.ini{color:#fff;font-weight:800;border:0}
.lg.big{border-radius:24px;box-shadow:0 8px 24px rgba(15,23,42,.12)}
.hero{position:relative;overflow:hidden;color:#fff;padding:26px 18px 18px;
  background:radial-gradient(circle at 85% 10%,rgba(255,214,102,.35),transparent 40%),radial-gradient(circle at 0% 100%,rgba(43,179,163,.45),transparent 45%),linear-gradient(150deg,#0b2a5b 0%,#16408a 55%,#1b6f8f 100%)}
.hero-in{position:relative;z-index:1}
.hero .testpill{margin:0 0 10px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#ffd666}
.hero h1{margin:6px 0 0;font-size:30px;line-height:1.05;font-weight:800;letter-spacing:-.5px}
.hero .hsub{margin-top:6px;font-size:15px;opacity:.9}
.cats{align-items:center}
.cats .tab{flex:0 0 auto;white-space:nowrap}
.open{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);
  padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600}
.dotl{width:9px;height:9px;border-radius:50%;background:#51cf66;box-shadow:0 0 0 3px rgba(81,207,102,.3)}
.cta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.cta div{border-radius:14px;padding:13px 10px;text-align:center;font-weight:800;font-size:14px;cursor:pointer}
.cta-a{background:#ffd43b;color:#3a2c00;box-shadow:0 6px 16px rgba(255,212,59,.35)}
.cta-b{background:#fff;color:#0b2a5b}
.hero-logos{display:flex;gap:10px;overflow-x:auto;margin-top:18px;padding-bottom:4px;scrollbar-width:none}
.hero-logos::-webkit-scrollbar{display:none}
.hl{flex:0 0 58px;height:58px;border-radius:14px;background:#fff;overflow:hidden;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.hl img{width:100%;height:100%;object-fit:contain}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.sec-h h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.3px}
.cnt2{background:#ffd43b;color:#3a2c00;font-weight:800;font-size:12px;padding:3px 9px;border-radius:999px;margin-right:auto;margin-left:8px}
.lnk2{color:var(--brand2);font-weight:700;font-size:14px;cursor:pointer}
.sp{flex:0 0 250px;border-radius:18px;padding:14px;gap:8px;box-shadow:0 6px 18px rgba(15,44,91,.08);border:1px solid var(--line)}
.sp-top{display:flex;gap:10px;align-items:center}
.sp .ti{font-size:18px;font-weight:800}
.go-sh{font-size:12px;font-weight:700;color:var(--brand2)}
.wall{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.wt{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 6px 10px;text-align:center;cursor:pointer;position:relative;
  display:flex;flex-direction:column;align-items:center;gap:5px;box-shadow:0 2px 8px rgba(15,44,91,.05)}
.wn{font-weight:700;font-size:12.5px;line-height:1.15}
.wc{font-size:11px;color:var(--quiet)}
.wdot{position:absolute;top:6px;right:6px;background:#ffd43b;color:#3a2c00;font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:999px}
.forecourt{background:#101828;color:#fff;border-radius:18px;padding:16px}
.fc-t{font-size:12px;letter-spacing:.14em;font-weight:800;color:#ffd43b}
.fuel2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.fuel2 div{background:#1d2939;border-radius:12px;padding:10px 4px;text-align:center;font-size:12px;font-weight:700;color:#cbd5e1}
.fuel2 b{display:block;font-family:ui-monospace,Consolas,monospace;font-size:20px;color:#ff6b6b;margin-top:4px;letter-spacing:.05em}
.fc-n{font-size:12px;color:#98a2b3;margin-top:10px}
.whatson{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#fff4e6,#ffe8cc);border:1px solid #ffd8a8;border-radius:16px;padding:14px}
.wo-ic{font-size:30px}
.shophero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:22px 16px 8px}
.sh-n{font-size:24px;font-weight:800;margin-top:12px}
.sh-c{color:var(--quiet);font-size:14px;margin-top:2px}
.offlink{color:var(--quiet)}
/* e6: the centre office */
.offwrap{min-height:100vh;background:radial-gradient(circle at 80% 0%,rgba(255,214,102,.25),transparent 40%),linear-gradient(160deg,#0b2a5b,#102a43 60%,#0b1f33);padding:40px 18px 30px}
.offcard{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:24px 20px;color:#fff;text-align:center}
.officon{font-size:42px}
.offname{font-size:15px;font-weight:700;color:#ffd666;margin-top:6px;letter-spacing:.02em}
.offtitle{font-size:30px;font-weight:800;letter-spacing:-.5px;margin-top:2px}
.offsub{font-size:13px;color:#cbd5e1;margin:4px 0 18px}
.offcard label{text-align:left}
.offcard input{text-align:center;font-size:22px;letter-spacing:.3em;font-weight:700;color:var(--ink);background:#fff}
.offcard input::placeholder{color:#98a2b3;letter-spacing:.1em;font-weight:600}
.offbtn{background:#ffd43b;border-color:#ffd43b;color:#3a2c00;font-size:16px;padding:14px}
.offhint{margin-top:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:14px;color:#e2e8f0;font-size:13px;line-height:1.6}
.kbd{display:inline-block;background:rgba(255,255,255,.15);border-radius:6px;padding:0 6px;font-weight:700}
.hometiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.htile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;box-shadow:0 2px 10px rgba(15,44,91,.06)}
.htile .k{font-size:11px;color:var(--quiet);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.htile .v{font-size:20px;font-weight:800;margin-top:4px}
.htile .s{font-size:12px;color:var(--quiet);margin-top:2px}
.htile.hot{border-color:#ffd43b;background:#fffbea}
.htile.wide2{grid-column:1 / -1;background:linear-gradient(135deg,#0b2a5b,#16408a);color:#fff;border:0}
.htile.wide2 .k,.htile.wide2 .s{color:#cbd5e1}
.shoprow .amt{font-weight:800;white-space:nowrap}
.ufhero{display:flex;gap:14px;align-items:center;padding:16px;background:#fff;border-bottom:1px solid var(--line)}
.ufn{font-size:20px;font-weight:800}
.ufm{font-size:13px;color:var(--quiet);margin-top:1px}
.ufp{margin-top:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ufbal{font-weight:800}
.uftabs{background:#fff;padding:10px 16px 12px;border-bottom:1px solid var(--line);position:sticky;top:52px;z-index:4}
.ivlines{margin-top:8px;border-top:1px solid var(--line)}
/* e7: Centre Office button on the shopper page; the office on a laptop */
.officebtn{position:absolute;top:14px;right:14px;z-index:3;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;
  text-decoration:none;font-weight:700;font-size:13px;padding:7px 12px;border-radius:999px}
.wide-only{display:none}
table.dt{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:14px;margin-top:8px}
.dt th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--quiet);padding:10px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-weight:700}
.dt td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.dt tbody tr:last-child td{border-bottom:0}
.dt tr[data-go]{cursor:pointer}
.dt tbody tr[data-go]:hover{background:#f3f7ff}
.dt .r{text-align:right;white-space:nowrap}
.dt .nmc{display:flex;gap:10px;align-items:center;font-weight:700}
@media (min-width: 1000px){
  body.office .app{max-width:1320px;padding-bottom:30px}
  body.office .wide-only{display:block}
  body.office .narrow-only{display:none}
  body.office .owl{display:grid;grid-template-columns:230px minmax(0,1fr);align-items:start}
  body.office .otabs{flex-direction:column;flex-wrap:nowrap;position:sticky;top:56px;padding:18px 12px;gap:4px;border-right:1px solid var(--line);min-height:calc(100vh - 56px)}
  body.office .otabs .tab{border:0;background:transparent;border-radius:10px;padding:11px 14px;font-size:14.5px;text-align:left}
  body.office .otabs .tab:hover{background:#e7edf7}
  body.office .otabs .tab.on{background:var(--brand);color:#fff}
  body.office #ow{padding:22px 28px}
  body.office .hometiles{grid-template-columns:repeat(4,1fr)}
  body.office .tiles{grid-template-columns:repeat(4,1fr)}
  body.office .ufhero{padding:22px 28px}
  body.office .uftabs{padding:10px 28px 12px;top:56px}
  body.office #uf{padding:22px 28px}
  body.office .ovgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}
  body.office [data-card]{max-width:880px}
  body.office [data-iv],body.office [data-scard]{max-width:880px}
  body.office .offcard,body.office .offhint{max-width:440px;margin-left:auto;margin-right:auto}
  body.office .offwrap{padding-top:80px}
}
/* e8: every small button the same height; labels used as buttons line up; WhatsApp green */
.btns{align-items:center}
.b.sm{display:inline-flex;align-items:center;justify-content:center;min-height:36px;line-height:1.1;box-sizing:border-box}
label.b{margin:0;font-weight:600}
.b.wa{background:#25d366;border-color:#25d366;color:#fff}
/* e9: maintenance, how charges work, back to the shopper page */
.fcard .fnotes{margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
.fnote{font-size:13px;padding:6px 10px;border-radius:10px;margin-top:6px;background:#f1f5f9}
.fnote.office{background:#e7edf7}
.fnote b{font-size:12px}
.fphoto{margin-top:8px}
.fphoto img{max-width:100%;max-height:420px;border-radius:12px;border:1px solid var(--line)}
.fctl{margin-top:10px;border-top:1px dashed var(--line);padding-top:4px}
.howbox{background:#f5f8ff;border-color:#d6e2f5;font-size:13.5px;line-height:1.5}
.howrow{margin-top:4px}
.howrow b{display:inline-block;min-width:110px}
.shopperlink{text-decoration:none;color:var(--quiet)}
.backshop{color:#cbd5e1;font-weight:600;text-decoration:none}
@media (min-width: 1000px){ body.office .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;align-items:start} body.office .otabs .shopperlink{margin-top:14px;border-top:1px solid var(--line);border-radius:0;padding-top:16px} }
/* e2: leases and charges */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.tile .k{font-size:11px;color:var(--quiet);text-transform:uppercase;letter-spacing:.04em}
.tile .v{font-size:18px;font-weight:800;margin-top:3px}
.tile .s{font-size:12px;color:var(--quiet);margin-top:1px}
.att{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.att:first-child{border-top:0}
.dot{flex:0 0 8px;height:8px;border-radius:50%;margin-top:6px}
.dot.red{background:var(--bad)} .dot.amber{background:#d99a00} .dot.grey{background:#98a2b3}
.rr{cursor:pointer}
.rr .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.rr .amt{font-weight:800;white-space:nowrap}
.st.empty{background:#eceff4;color:var(--quiet)}
.sub{font-size:13px;font-weight:700;color:var(--brand);margin:16px 0 2px;text-transform:uppercase;letter-spacing:.04em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two label{margin-top:12px}
.two > div{min-width:0}
.two input,.two select{min-width:0;max-width:100%}
input[type=date]{-webkit-appearance:none;appearance:none;min-height:44px}
.crow{border-top:1px solid var(--line);padding:10px 0}
.crow:first-of-type{border-top:0}
.crow .hd{display:flex;align-items:center;gap:10px;justify-content:space-between}
.crow .nm{font-weight:700;font-size:14px}
.crow .est{font-size:12px;color:var(--quiet);margin-top:4px}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;margin:0;white-space:nowrap}
.chk input{width:20px;height:20px;accent-color:var(--brand)}
.crow select,.crow input[type=text]{margin-top:6px;font-size:15px;padding:8px 10px}
.empty{font-size:14px;color:var(--quiet);padding:6px 2px}
.info{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.info b{color:var(--quiet);font-weight:600}
.h3{font-size:15px;font-weight:700;margin:20px 0 4px}

/* BOTTOM BAR */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .in{max-width:488px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 8px;text-align:center;
  font-weight:600;font-size:14px;color:var(--ink);cursor:pointer}
.btn.main{background:var(--brand);border-color:var(--brand);color:#fff}
.foot{text-align:center;font-size:11px;color:var(--quiet);margin:26px 0 8px}
.loading{padding:60px 16px;text-align:center;color:var(--quiet)}
</style>
</head>
<body>
<div class="app" id="app"><div class="loading">Loading…</div></div>
<nav class="bar"><div class="in" id="bar"></div></nav>

<script>
(function(){
'use strict';
var ESM_BUILD = 'ESM e11';
var MODE = 'office';   // Block 1 = 'shop' (index.html: shoppers + tenants) · Block 2 = 'office' (office.html). Set by build_esm.py.
var SB_URL = 'https://pqduivcxwykcixqsfrwi.supabase.co';
var SB_KEY = 'sb_publishable_Cl8uDRrLqx9VMaC3lifpWA_Wl91vVy2';   // OTR-Tennis public (publishable) key
var CATS = ['Food','Fashion','Health','Services','Fuel & car','Other'];

var qs = new URLSearchParams(location.search);
var CID = qs.get('c') ? Number(qs.get('c')) : null;
var DOOR = null;          // last door data
var APP = document.getElementById('app');
var BAR = document.getElementById('bar');

// ---------- helpers ----------
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function ymd(s){ var p = String(s).slice(0,10).split('-'); return new Date(Date.UTC(+p[0], +p[1]-1, +p[2])); }
function nice(s){ var d = ymd(s); return DAYS[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()]; }
function addDays(s, n){ var d = ymd(s); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10); }
function initials(n){ var w = String(n).trim().split(/\s+/); return ((w[0]||'')[0]||'').toUpperCase() + ((w[1]||'')[0]||'').toUpperCase(); }
function startsIn(name, q){ // first letters only: any word of the name starts with what was typed
  q = q.trim().toLowerCase(); if (!q) return true;
  return String(name).toLowerCase().split(/[\s&·,\-\/]+/).some(function(w){ return w.indexOf(q) === 0; }) ||
         String(name).toLowerCase().indexOf(q) === 0;
}
function $(id){ return document.getElementById(id); }

function rpc(fn, args){
  return fetch(SB_URL + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(args || {})
  }).then(function(r){
    return r.json().catch(function(){ return null; }).then(function(j){
      if (!r.ok) return { ok:false, msg: (j && j.message) ? j.message : 'Could not reach the server.' };
      return j || { ok:false, msg:'Empty answer from the server.' };
    });
  }).catch(function(){ return { ok:false, msg:'No connection. Please check your internet.' }; });
}

// login kept for this browser tab only
function sess(){ try { return JSON.parse(sessionStorage.getItem('esm_' + CID) || 'null'); } catch(e){ return null; } }
function setSess(v){ try { if (v) sessionStorage.setItem('esm_' + CID, JSON.stringify(v)); else sessionStorage.removeItem('esm_' + CID); } catch(e){} }

function go(h){ if (location.hash === h) route(); else location.hash = h; }
function top0(){ window.scrollTo(0,0); }

function mini(title, backTo){
  return '<div class="mini">' + (backTo ? '<button class="back" data-go="' + esc(backTo) + '">‹ Back</button>' : '') +
    '<div class="t">' + esc(title) + '</div></div>';
}

function bar(){
  if (MODE === 'office') { BAR.parentNode.style.display = 'none'; return; }   // Block 2 has no bottom bar
  var s = sess();
  BAR.style.gridTemplateColumns = '1fr';
  BAR.innerHTML = s && s.role === 'shop'
    ? '<div class="btn main" data-go="#myshop">My shop</div>'
    : '<div class="btn main" data-go="#login/shop">Tenant login</div>';
}

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-go]');
  if (t) { e.preventDefault(); go(t.getAttribute('data-go')); }
});

// ---------- door data ----------
function loadDoor(){
  return rpc('ctr_door', { p_centre: CID }).then(function(d){
    if (d && d.ok) { DOOR = d; if (!CID) CID = d.centre.id; }
    return d;
  });
}

// ---------- e5: logos ----------
var AV_COLS = ['#e8590c','#2b8a3e','#1971c2','#9c36b5','#c2255c','#0c8599','#5f3dc4','#d9480f','#2f9e44'];
function avColour(name){ var h = 0; String(name).split('').forEach(function(ch){ h = (h * 31 + ch.charCodeAt(0)) >>> 0; }); return AV_COLS[h % AV_COLS.length]; }
function logoBox(u, px, cls){
  var st = 'width:' + px + 'px;height:' + px + 'px;';
  if (u && u.logo) return '<div class="lg ' + (cls || '') + '" style="' + st + '"><img src="' + esc(u.logo) + '" alt=""></div>';
  return '<div class="lg ini ' + (cls || '') + '" style="' + st + 'background:' + avColour(u ? u.name : '') + ';font-size:' + Math.round(px * 0.36) + 'px">' + esc(initials(u ? u.name : '?')) + '</div>';
}
function unitById(id){ return (DOOR && DOOR.units || []).filter(function(u){ return u.id === id; })[0]; }
// a picture from the phone → a 200×200 square JPEG (about 10–30 KB), white background, logo centred
function fileToLogo(file){
  return new Promise(function(ok, no){
    if (!file || !/^image\//.test(file.type)) return no('Choose a picture (JPG or PNG).');
    var fr = new FileReader();
    fr.onerror = function(){ no('That picture could not be read.'); };
    fr.onload = function(){
      var im = new Image();
      im.onerror = function(){ no('That picture could not be read.'); };
      im.onload = function(){
        var S = 200, pad = 12, cv = document.createElement('canvas'); cv.width = S; cv.height = S;
        var g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, S, S);
        var k = Math.min((S - 2 * pad) / im.width, (S - 2 * pad) / im.height), w = im.width * k, h = im.height * k;
        g.drawImage(im, (S - w) / 2, (S - h) / 2, w, h);
        ok(cv.toDataURL('image/jpeg', 0.85));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function specialCard(s){
  var u = unitById(s.unit_id) || { name: s.unit };
  return '<div class="sp" data-go="#shop/' + s.unit_id + '">' +
    '<div class="sp-top">' + logoBox(u, 46) + '<div><div class="shop">' + esc(s.unit) + '</div><div class="until">until ' + nice(s.ends_on) + '</div></div></div>' +
    '<div class="ti">' + esc(s.title) + '</div>' +
    (s.detail ? '<div class="de">' + esc(s.detail) + '</div>' : '') +
    '<div class="bt">' + (s.price ? '<span class="price">' + esc(s.price) + '</span>' : '<span></span>') + '<span class="go-sh">Visit the shop ›</span></div></div>';
}

function shopRow(u, nSpecials){
  var meta = [u.category, u.location, u.hours].filter(Boolean).map(esc).join(' · ');
  return '<div class="shoprow" data-go="#shop/' + u.id + '">' + logoBox(u, 46) +
    '<div><div class="nm">' + esc(u.name) + (nSpecials ? '<span class="tag">' + nSpecials + ' special' + (nSpecials > 1 ? 's' : '') + '</span>' : '') +
    '</div><div class="mt">' + meta + '</div></div><div class="go">›</div></div>';
}

function countBy(list){ var m = {}; list.forEach(function(s){ m[s.unit_id] = (m[s.unit_id] || 0) + 1; }); return m; }

// ---------- pages ----------
var DOOR_CAT = '';
function pageDoor(){
  var c = DOOR.centre, sp = DOOR.specials, units = DOOR.units, per = countBy(sp);
  var used = CATS.filter(function(k){ return units.some(function(u){ return u.category === k; }); });
  var hasFuel = units.some(function(u){ return u.category === 'Fuel & car'; });
  APP.innerHTML =
    '<header class="hero"><a class="officebtn" href="office.html' + (CID ? '?c=' + CID : '') + '">🏢 Centre Office</a>' +
      '<div class="hero-in">' +
        (c.is_test ? '<span class="testpill">TEST</span>' : '') +
        '<div class="eyebrow">Come in · see what\'s on today</div>' +
        '<h1>' + esc(c.name) + '</h1>' +
        '<div class="hsub">' + esc(c.tagline || 'Shops · Specials · Services') + '</div>' +
        (c.hours ? '<div class="open"><span class="dotl"></span>Open ' + esc(c.hours) + '</div>' : '') +
        '<div class="cta"><div class="cta-a" id="goSpecials">🏷️ ' + sp.length + ' special' + (sp.length === 1 ? '' : 's') + ' today</div>' +
        '<div class="cta-b" data-go="#shops">🛍️ Browse ' + units.length + ' shops</div></div>' +
      '</div>' +
      '<div class="hero-logos">' + units.filter(function(u){ return u.logo; }).slice(0, 8).map(function(u){
        return '<div class="hl" data-go="#shop/' + u.id + '"><img src="' + esc(u.logo) + '" alt="' + esc(u.name) + '"></div>'; }).join('') + '</div>' +
    '</header>' +
    '<section class="sec" id="secSpecials"><div class="sec-h"><h2>Hot right now</h2>' + (sp.length ? '<span class="cnt2">' + sp.length + '</span>' : '') + '</div>' +
      (sp.length ? '<div class="row">' + sp.map(specialCard).join('') + '</div>'
                 : '<div class="box empty">No specials right now. Pop in and say hello, or check again soon.</div>') +
    '</section>' +
    '<section class="sec"><div class="sec-h"><h2>Our shops</h2><span class="lnk2" data-go="#shops">Search ›</span></div>' +
      '<div class="cats" id="dCats">' + ['All'].concat(used).map(function(k){
        var on = (k === 'All' ? DOOR_CAT === '' : DOOR_CAT === k);
        return '<div class="tab' + (on ? ' on' : '') + '" data-dcat="' + esc(k) + '">' + esc(k) + '</div>'; }).join('') + '</div>' +
      '<div class="wall">' + units.filter(function(u){ return !DOOR_CAT || u.category === DOOR_CAT; }).map(function(u){
        return '<div class="wt" data-go="#shop/' + u.id + '">' + logoBox(u, 64) + '<div class="wn">' + esc(u.name) + '</div>' +
          '<div class="wc">' + esc(u.category) + '</div>' + (per[u.id] ? '<span class="wdot">' + per[u.id] + ' special' + (per[u.id] > 1 ? 's' : '') + '</span>' : '') + '</div>';
      }).join('') + '</div>' +
    '</section>' +
    (hasFuel ? '<section class="sec"><div class="sec-h"><h2>Fill up while you shop</h2></div><div class="forecourt">' +
      '<div class="fc-t">FUEL PRICES TODAY</div><div class="fuel2"><div>93<b>—.——</b></div><div>95<b>—.——</b></div><div>Diesel<b>—.——</b></div></div>' +
      '<div class="fc-n">Live prices are coming soon.</div></div></section>' : '') +
    '<section class="sec"><div class="sec-h"><h2>What\'s on</h2></div><div class="whatson">' +
      '<div class="wo-ic">🎉</div><div><b>Events and news are coming soon</b><div class="hint" style="margin-top:2px">Markets, kids\' days, late-night shopping: watch this space.</div></div></div></section>' +
    '<section class="sec"><div class="sec-h"><h2>Visit us</h2></div><div class="box"><div class="info">' +
      (c.hours ? '<b>Hours</b><span>' + esc(c.hours) + '</span>' : '') +
      (c.phone ? '<b>Phone</b><a href="tel:' + esc(c.phone.replace(/\s/g,'')) + '">' + esc(c.phone) + '</a>' : '') +
      (c.address ? '<b>Address</b><span>' + esc(c.address) + '</span>' : '') +
      '</div><div class="row" style="margin-top:12px"><div class="ph" style="flex-basis:100%;height:110px">map — to come</div></div></div></section>' +
    '<div class="foot">' + ESM_BUILD + '</div>';
  $('goSpecials').onclick = function(){ $('secSpecials').scrollIntoView({ behavior:'smooth' }); };
  $('dCats').onclick = function(e){ var t = e.target.closest('[data-dcat]'); if (!t) return;
    var k = t.getAttribute('data-dcat'); DOOR_CAT = (k === 'All' ? '' : k); var y = window.scrollY; pageDoor(); window.scrollTo(0, y); };
}

function pageShops(){
  var units = DOOR.units, per = countBy(DOOR.specials), cat = '';
  APP.innerHTML = mini('Find a shop', '#') +
    '<div class="pad"><input id="q" placeholder="Type the first letters of a shop" autocomplete="off">' +
    '<div class="cats" id="cats"></div><div id="list" style="margin-top:12px"></div></div>';
  var used = CATS.filter(function(k){ return units.some(function(u){ return u.category === k; }); });
  function drawCats(){
    $('cats').innerHTML = ['All'].concat(used).map(function(k){
      var on = (k === 'All' ? cat === '' : cat === k);
      return '<div class="tab' + (on ? ' on' : '') + '" data-cat="' + esc(k) + '">' + esc(k) + '</div>'; }).join('');
  }
  function draw(){
    var q = $('q').value;
    var list = units.filter(function(u){ return (!cat || u.category === cat) && startsIn(u.name, q); });
    $('list').innerHTML = list.length ? list.map(function(u){ return shopRow(u, per[u.id]); }).join('') : '<div class="empty">No shop starts with that.</div>';
  }
  $('cats').onclick = function(e){ var t = e.target.closest('[data-cat]'); if (!t) return;
    var k = t.getAttribute('data-cat'); cat = (k === 'All' ? '' : k); drawCats(); draw(); };
  $('q').oninput = draw; drawCats(); draw();
}

function pageShop(id){
  var u = DOOR.units.filter(function(x){ return x.id === id; })[0];
  if (!u) { APP.innerHTML = mini('Shop', '#') + '<div class="pad empty">This shop is not on the door any more.</div>'; return; }
  var sp = DOOR.specials.filter(function(s){ return s.unit_id === id; });
  APP.innerHTML = mini(u.name, '#') +
    '<div class="shophero" style="background:linear-gradient(160deg,' + avColour(u.name) + '22,#ffffff 70%)">' + logoBox(u, 120, 'big') +
      '<div class="sh-n">' + esc(u.name) + '</div><div class="sh-c">' + esc(u.category) + (u.location ? ' · ' + esc(u.location) : '') + '</div></div>' +
    '<div class="pad"><div class="box"><div class="info">' +
        (u.location ? '<b>Where</b><span>' + esc(u.location) + '</span>' : '') +
        (u.hours ? '<b>Hours</b><span>' + esc(u.hours) + '</span>' : '') +
        (u.phone ? '<b>Phone</b><a href="tel:' + esc(u.phone.replace(/\s/g,'')) + '">' + esc(u.phone) + '</a>' : '') +
      '</div>' + (u.phone ? '<a class="b main wide" style="text-decoration:none" href="tel:' + esc(u.phone.replace(/\s/g,'')) + '">Call ' + esc(u.name) + '</a>' : '') + '</div>' +
      '<div class="h3">Specials</div>' +
      (sp.length ? sp.map(function(s){
        return '<div class="item"><div class="ti">' + esc(s.title) + (s.price ? ' <span class="price">' + esc(s.price) + '</span>' : '') + '</div>' +
          (s.detail ? '<div class="de">' + esc(s.detail) + '</div>' : '') + '<div class="mt">until ' + nice(s.ends_on) + '</div></div>'; }).join('')
        : '<div class="empty">No specials from this shop right now.</div>') +
    '</div>';
}

function pageLogin(role){
  var isOwner = role === 'owner';
  APP.innerHTML = mini(isOwner ? 'Centre office · owner login' : 'Tenant login', isOwner ? null : '#') +
    '<div class="pad"><div class="box">' +
      '<label for="code">' + (isOwner ? 'Owner code' : 'Your shop code') + '</label>' +
      '<input id="code" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="6 digits">' +
      '<div class="hint">' + (isOwner ? 'The code for the centre manager.' : 'The centre manager gives each shop its own code.') + '</div>' +
      '<div class="b main wide" id="open">Open</div><div class="msg" id="m"></div>' +
    '</div></div>';
  function open(){
    var code = $('code').value.trim();
    if (!/^\d{6}$/.test(code)) { $('m').className = 'msg err'; $('m').textContent = 'The code is 6 digits.'; return; }
    $('m').className = 'msg'; $('m').textContent = 'Checking…';
    rpc('ctr_login', { p_centre: CID, p_code: code }).then(function(r){
      if (!r.ok) { $('m').className = 'msg err'; $('m').textContent = r.msg; return; }
      if (isOwner && r.role !== 'owner') { $('m').className = 'msg err'; $('m').textContent = 'That is a shop code. Shops log in on the centre\'s shop page, not in the office.'; return; }
      if (!isOwner && r.role !== 'shop') { $('m').className = 'msg err'; $('m').textContent = 'That is the owner code. The owner logs in at the centre office page.'; return; }
      setSess({ role: r.role, code: code, unit: r.unit ? r.unit.name : null }); bar();
      go(isOwner ? '#owner' : '#myshop');
    });
  }
  $('open').onclick = open;
  $('code').onkeydown = function(e){ if (e.key === 'Enter') open(); };
  $('code').focus();
}

function statusPill(s, today){
  if (s.status !== 'rejected' && s.ends_on < today) return '<span class="st ended">Ended</span>';
  if (s.status === 'pending') return '<span class="st pending">Waiting for approval</span>';
  if (s.status === 'approved') return '<span class="st approved">On the door</span>';
  return '<span class="st rejected">Not approved</span>';
}

function pageMyShop(note){
  var s = sess();
  if (!s || s.role !== 'shop') { go('#login/shop'); return; }
  APP.innerHTML = mini(s.unit || 'My shop', '#') + '<div class="loading">Loading…</div>';
  rpc('ctr_shop_home', { p_centre: CID, p_code: s.code }).then(function(r){
    if (!r.ok) { setSess(null); bar(); APP.innerHTML = mini('My shop', '#') + '<div class="pad"><div class="msg err">' + esc(r.msg) + '</div></div>'; return; }
    var today = r.today;
    APP.innerHTML = mini(r.unit.name, '#') +
      '<div class="pad">' +
      '<div class="box"><div style="font-weight:700;font-size:16px">Post a special</div>' +
        '<div class="hint">The centre manager checks it, then it shows on the door.</div>' +
        '<label for="ti">Heading</label><input id="ti" maxlength="60" placeholder="e.g. 2 for 1 on fresh bread">' +
        '<label for="de">Details (optional)</label><textarea id="de" maxlength="300" placeholder="e.g. Every morning before 10:00"></textarea>' +
        '<label for="pr">Price (optional)</label><input id="pr" maxlength="30" placeholder="e.g. E25">' +
        '<label for="en">Last day</label><input id="en" type="date" min="' + today + '" max="' + addDays(today, 60) + '" value="' + addDays(today, 7) + '">' +
        '<div class="b main wide" id="send">Send for approval</div><div class="msg' + (note ? ' ok' : '') + '" id="m">' + esc(note || '') + '</div>' +
      '</div>' +
      '<div class="h3">Your logo</div><div class="box" style="display:flex;gap:14px;align-items:center">' + logoBox(r.unit, 72) +
        '<div style="flex:1"><div class="hint" style="margin:0 0 8px">Shoppers see it on the door, your specials and your shop page.</div>' +
        '<label class="b sm main">' + (r.unit.logo ? 'Change logo' : 'Add your logo') + '<input type="file" accept="image/*" id="myLogo" style="display:none"></label>' +
        '<div class="msg" id="logoMsg"></div></div></div>' +
      '<div id="acct"></div><div id="mfaults"></div>' +
      '<div class="h3">Your specials</div><div id="mine"></div>' +
      '<div class="b wide" id="out">Log out</div></div>';
    $('mine').innerHTML = r.specials.length ? r.specials.map(function(x){
      return '<div class="item" data-id="' + x.id + '"><div style="display:flex;justify-content:space-between;gap:8px;align-items:start">' +
        '<div class="ti">' + esc(x.title) + '</div>' + statusPill(x, today) + '</div>' +
        (x.detail ? '<div class="de">' + esc(x.detail) + '</div>' : '') +
        '<div class="mt">' + (x.price ? esc(x.price) + ' · ' : '') + 'until ' + nice(x.ends_on) + '</div>' +
        (x.status === 'rejected' && x.reason ? '<div class="mt">Reason: ' + esc(x.reason) + '</div>' : '') +
        '<div class="btns"><div class="b sm no" data-rm="' + x.id + '">Remove</div></div><div class="slot"></div></div>';
    }).join('') : '<div class="empty">You have not posted any specials yet.</div>';
    shopAccount($('acct'), s);
    shopFaults($('mfaults'), s);
    $('myLogo').onchange = function(){
      var lm = $('logoMsg'); lm.className = 'msg'; lm.textContent = 'Preparing the logo…';
      fileToLogo($('myLogo').files[0]).then(function(data){
        return rpc('ctr_unit_logo_save', { p_centre: CID, p_code: s.code, p_unit: null, p_logo: data });
      }).then(function(x){
        if (!x.ok) { lm.className = 'msg err'; lm.textContent = x.msg; return; }
        pageMyShop('Your logo is saved and shows on the door.');
      }, function(err){ lm.className = 'msg err'; lm.textContent = String(err); });
    };
    $('send').onclick = function(){
      var m = $('m');
      m.className = 'msg'; m.textContent = 'Sending…';
      rpc('ctr_special_post', { p_centre: CID, p_code: s.code, p_title: $('ti').value, p_detail: $('de').value,
                                p_price: $('pr').value, p_ends: $('en').value || null }).then(function(x){
        if (!x.ok) { m.className = 'msg err'; m.textContent = x.msg; return; }
        pageMyShop('Sent. The centre manager will check it before it goes on the door.');
      });
    };
    $('mine').onclick = function(e){

// =====================================================================
// e2 · LEASES AND CHARGES (owner only)
// =====================================================================
var MGMT_OPEN = null;      // the unit whose card is open on the Leases tab
var METHODS = { fixed:'Fixed amount', per_m2:'Rate per m²', share:'Share by area', metered:'Metered', off:'Off' };

function money(cur, n){
  if (n == null || isNaN(n)) return '—';
  var neg = n < 0, p = Math.abs(Math.round(n * 100) / 100).toFixed(2).split('.');
  return (neg ? '-' : '') + cur + ' ' + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + '.' + p[1];   // non-breaking spaces: an amount never splits over two lines
}
function niceY(s){ var d = ymd(s); return d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); }
function numStr(n){ return n == null ? '' : String(+n); }
function m2s(n){ return n == null || n === '' ? '— m²' : String(+n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' m²'; }
function daysTo(a, b){ return Math.round((ymd(b) - ymd(a)) / 864e5); }
function addYears(s, n){ var d = ymd(s); d.setUTCFullYear(d.getUTCFullYear() + n); return d.toISOString().slice(0,10); }
function fullYears(a, b){ if (b < a) return 0; var y = +b.slice(0,4) - +a.slice(0,4); if (b.slice(5) < a.slice(5)) y--; return Math.max(0, y); }
function toNum(v){ v = String(v == null ? '' : v).replace(/\s/g, '').replace(',', '.'); return v === '' ? null : Number(v); }

// rent now (after the yearly increases), the next increase, and the lease's state
function leaseCalc(l, u, today){
  var pct = +l.increase_pct || 0;
  var base = l.rent_basis === 'spaces' ? spacesRent(u) : l.rent_basis === 'm2' ? (+l.rent_value) * (+u.area_m2 || 0) : +l.rent_value;
  var yrs = l.start_on > today ? 0 : fullYears(l.start_on, today), esc_ = Math.pow(1 + pct / 100, yrs);
  var rent = l.rent_basis === 'spaces'   // each space's rate is rounded to the cent after the increases, so invoice lines multiply out exactly
    ? Math.round((u.spaces || []).reduce(function(a, sp){ return a + (+sp.area_m2 || 0) * Math.round(spaceRate(sp) * esc_ * 100) / 100; }, 0) * 100) / 100
    : Math.round(base * esc_ * 100) / 100;
  var next = pct > 0 ? addYears(l.start_on, yrs + 1) : null;
  var c = { rent: rent, esc: esc_, next: next, nextRent: Math.round(rent * (1 + pct / 100) * 100) / 100,
            toNext: next ? daysTo(today, next) : null, toEnd: l.end_on ? daysTo(today, l.end_on) : null };
  c.state = l.start_on > today ? 'starts' : (l.end_on && l.end_on < today) ? 'past' : (c.toEnd != null && c.toEnd <= 90) ? 'ending' : 'running';
  return c;
}
function leasePill(c, l){
  if (c.state === 'past') return '<span class="st rejected">Past its end</span>';
  if (c.state === 'ending') return '<span class="st pending">Ends in ' + c.toEnd + ' days</span>';
  if (c.state === 'starts') return '<span class="st ended">Starts ' + niceY(l.start_on) + '</span>';
  return '<span class="st approved">Running</span>';
}

// e4 · spaces (SAPOA): each unit's spaces, its rentable m², rent from the spaces
function mgmtLoad(s){
  return rpc('ctr_mgmt_home', { p_centre: CID, p_code: s.code }).then(function(D){
    if (!D || !D.ok) return D;
    D.space_types = D.space_types || []; D.unit_spaces = D.unit_spaces || [];
    var byId = {}; D.space_types.forEach(function(t){ byId[t.id] = t; });
    D.units.forEach(function(u){ u.spaces = D.unit_spaces.filter(function(x){ return x.unit_id === u.id; })
      .map(function(x){ return { id: x.id, type_id: x.type_id, type: byId[x.type_id], area_m2: +x.area_m2, rate: x.rate == null ? null : +x.rate }; }); });
    return D;
  });
}
function spaceRate(sp){ return sp.rate != null && sp.rate !== '' && !isNaN(sp.rate) ? +sp.rate : (sp.type ? +sp.type.rate : 0); }
function spacesRent(u){ return (u.spaces || []).reduce(function(a, sp){ return a + (+sp.area_m2 || 0) * spaceRate(sp); }, 0); }
function rentableOf(spaces){ return Math.round(spaces.reduce(function(a, sp){ return a + (sp.type && sp.type.rentable ? (+sp.area_m2 || 0) : 0); }, 0) * 100) / 100; }
function spaceRow(D, sp){
  return '<div class="sprow" style="border-top:1px solid var(--line);padding:8px 0">' +
    '<div style="display:flex;gap:8px;align-items:center"><select data-sp="type" style="flex:1">' + D.space_types.map(function(t){
      return '<option value="' + t.id + '"' + (t.id === sp.type_id ? ' selected' : '') + '>' + esc(t.name) + (t.rentable ? ' (R)' : '') + '</option>'; }).join('') + '</select>' +
    '<span class="b sm no" data-spdel>✕</span></div>' +
    '<div class="two"><div><label>m²</label><input data-sp="area" inputmode="decimal" value="' + esc(numStr(sp.area_m2)) + '"></div>' +
    '<div><label>This shop\'s rate per m²</label><input data-sp="rate" inputmode="decimal" placeholder="usual ' +
      esc(String((D.space_types.filter(function(t){ return t.id === sp.type_id; })[0] || D.space_types[0] || { rate: 0 }).rate)) + '" value="' + esc(numStr(sp.rate)) + '"></div></div></div>';
}
function spacesText(u){
  return (u.spaces || []).map(function(sp){ return (sp.type ? sp.type.name : '?') + ' ' + m2s(sp.area_m2); }).join(' + ');
}

function mgmtTotals(D){
  var leaseOf = {}; D.leases.forEach(function(l){ leaseOf[l.unit_id] = l; });
  var all = 0, let_ = 0;
  D.units.forEach(function(u){ var a = +u.area_m2 || 0; all += a; if (!u.vacant && leaseOf[u.id]) let_ += a; });
  return { leaseOf: leaseOf, all: all, let_: let_, basis: D.centre.share_basis === 'let' ? let_ : all };
}

// what one charge comes to for one shop each month (or how it will be worked out)
function chargeRow(D, u, ct){
  var r = D.unit_charges.filter(function(x){ return x.unit_id === u.id && x.charge_id === ct.id; })[0];
  return r || { enabled: ct.method !== 'off', method: null, amount: null, has_meter: false, meter_no: null, _new: true };
}
function chargeEst(D, u, ct, row, T){
  var cur = D.centre.currency, vat = ct.vat ? ' + VAT' : '';
  if (!row.enabled) return 'Off for this shop';
  var m = row.method || ct.method, area = +u.area_m2 || 0;
  function share(){ return T.basis > 0 && area > 0 ? (Math.round(area / T.basis * 10000) / 100) + '% of the centre\'s bill each month' + vat : 'Share by area: fill in the m² first'; }
  if (m === 'off') return 'Off';
  if (m === 'fixed') return money(cur, row.amount != null ? +row.amount : +ct.rate) + ' a month' + vat;
  if (m === 'per_m2') return area ? m2s(area) + ' × ' + money(cur, +ct.rate) + ' = ' + money(cur, area * ct.rate) + ' a month' + vat : 'Rate per m²: fill in the m² first';
  if (m === 'share') return share();
  if (m === 'metered') return row.has_meter
    ? 'Meter ' + esc(row.meter_no || '') + ': units used × ' + money(cur, +ct.rate) + (+ct.basic ? ' + basic ' + money(cur, +ct.basic) : '') + vat
    : 'No meter, so ' + share();
  return '';
}

function ownerLeases(box, s, top){
  box.innerHTML = '<div class="loading">Loading…</div>';
  mgmtLoad(s).then(function(D){
    if (!D.ok) { box.innerHTML = '<div class="msg err">' + esc(D.msg) + '</div>'; return; }
    var cur = D.centre.currency, today = D.today, T = mgmtTotals(D);
    var roll = 0, ending = 0, past = 0, incr = 0, empty = 0, att = [];
    D.units.forEach(function(u){
      var l = T.leaseOf[u.id];
      if (u.vacant || !l) { empty++; att.push({ u: u, dot: 'grey', t: esc(u.name) + ' is empty' + (u.area_m2 ? ' (' + m2s(u.area_m2) + ')' : '') }); return; }
      var c = leaseCalc(l, u, today); if (c.state !== 'starts') roll += c.rent;

                    : '<div class="empty">Nothing needs attention.</div>') + '</div>' +
      '<div class="h3">Rent roll · ' + D.units.length + ' units' + (empty ? ' · ' + empty + ' empty' : '') + '</div>' +
      wideT(['Unit', 'Tenant', 'Rentable', 'Spaces', 'Lease', 'Rent now', ''], D.units.map(function(u){
        var l = T.leaseOf[u.id], c = l && !u.vacant ? leaseCalc(l, u, today) : null;
        return { go: '#unit/' + u.id + '/lease', cells: ['<b>' + esc(u.name) + '</b>', c ? esc(l.tenant_name) : '<span class="hint">Empty</span>', m2s(u.area_m2),
                 '<span class="hint">' + esc(spacesText(u)) + '</span>', c ? niceY(l.start_on) + ' – ' + (l.end_on ? niceY(l.end_on) : 'open') : '',
                 c ? money(cur, c.rent) : '', c ? leasePill(c, l) : '<span class="st empty">Empty</span>'], right: [2, 5] };
      })) + '<div class="narrow-only">' +
      D.units.map(function(u){
        var l = T.leaseOf[u.id], c = l && !u.vacant ? leaseCalc(l, u, today) : null;
        return '<div class="item rr" data-u="' + u.id + '"><div class="top" data-open="' + u.id + '"><div>' +
          '<div class="ti">' + esc(u.name) + '</div>' +
          '<div class="mt">' + (c ? esc(l.tenant_name) : 'Empty') + ' · ' + m2s(u.area_m2) + ' rentable' + (u.location ? ' · ' + esc(u.location) : '') + '</div>' +
          (u.spaces.length > 1 ? '<div class="mt">' + esc(spacesText(u)) + '</div>' : '') +
          (c ? '<div class="mt">' + niceY(l.start_on) + ' to ' + (l.end_on ? niceY(l.end_on) : 'no end date') + '</div>' : '') +
          '</div><div style="text-align:right">' + (c ? '<div class="amt">' + money(cur, c.rent) + '</div>' + leasePill(c, l) : '<span class="st empty">Empty</span>') +
          '</div></div></div>';
      }).join('') + '</div>' +
      '<div class="btns" style="margin-top:14px"><div class="b" id="addUnit">Add an empty unit</div><div class="b" id="csv">Export to Excel</div></div>' +
      '<div id="addUnitSlot"></div>' +
      '<div class="b wide" id="out">Log out</div>';
    box.innerHTML = html;
    box.onclick = function(e){
      var t;
      if ((t = e.target.closest('[data-open]'))) {
        go('#unit/' + t.getAttribute('data-open') + '/lease');

          '<div class="hint">It is not on the door until a lease is added.</div>' +
          '<label>Unit name</label><input id="nuName" maxlength="60" placeholder="e.g. Shop 10">' +
          '<div class="two"><div><label>Where</label><input id="nuLoc" maxlength="40" placeholder="e.g. First floor"></div>' +
          '<div><label>Shop floor (m²)</label><input id="nuArea" inputmode="decimal"></div></div>' +
          '<div class="btns"><div class="b sm main" id="nuSave">Add</div><div class="b sm" id="nuCancel">Cancel</div></div><div class="msg" id="nuMsg"></div></div>';
        $('nuCancel').onclick = function(ev){ ev.stopPropagation(); $('addUnitSlot').innerHTML = ''; };
        $('nuSave').onclick = function(ev){ ev.stopPropagation();
          var a = toNum($('nuArea').value);
          if (a != null && isNaN(a)) { $('nuMsg').className = 'msg err'; $('nuMsg').textContent = 'The size must be a number.'; return; }
          rpc('ctr_space_save', { p_centre: CID, p_code: s.code, p_unit: null, p_name: $('nuName').value, p_location: $('nuLoc').value, p_area: a }).then(function(x){
            if (!x.ok) { $('nuMsg').className = 'msg err'; $('nuMsg').textContent = x.msg; return; }
            go('#unit/' + x.id + '/lease');
          });

      } else if (e.target.id === 'csv') { rentRollCsv(D, T);
      } else if (e.target.id === 'out') { setSess(null); bar(); go('#'); }
    };
  });
}

function wireUnitCard(D, wrap, s, T, u, done){
  var card = wrap.querySelector('[data-card]');
  var l = T.leaseOf[u.id], cur = D.centre.currency;
  done = done || function(msg){ pageOwner(msg); };
  card.onclick = function(e){ e.stopPropagation(); };
  function val(sel){ var el = card.querySelector(sel); return el ? el.value : ''; }
  // the spaces as typed on the card
  function readSpaces(){
    return Array.prototype.map.call(card.querySelectorAll('.sprow'), function(r){
      var t = D.space_types.filter(function(x){ return x.id === Number(r.querySelector('[data-sp=type]').value); })[0];
      return { type_id: t ? t.id : null, type: t, area_m2: toNum(r.querySelector('[data-sp=area]').value), rate: toNum(r.querySelector('[data-sp=rate]').value) };
    });
  }
  function cardUnit(){ if (!card.querySelector('.sprow') && !card.querySelector('[data-spaces]')) return { id: u.id, spaces: u.spaces, area_m2: +u.area_m2 || 0 };
    var sp = readSpaces(); return { id: u.id, spaces: sp, area_m2: rentableOf(sp) }; }
  function showCalc(){
    if (!card.querySelector('[data-calc]')) return;
    var cu = cardUnit(), L = { rent_basis: val('[data-l=rent_basis]'), rent_value: toNum(val('[data-l=rent_value]')),
      increase_pct: toNum(val('[data-l=increase_pct]')) || 0, start_on: val('[data-l=start_on]'), end_on: val('[data-l=end_on]') };
    card.querySelector('[data-rvwrap]').style.display = L.rent_basis === 'spaces' ? 'none' : '';
    var all = cu.spaces.reduce(function(a, x){ return a + (+x.area_m2 || 0); }, 0);
    card.querySelector('[data-rm2]').textContent = 'Rentable: ' + m2s(cu.area_m2) + (all > cu.area_m2 ? ' · plus ' + m2s(Math.round((all - cu.area_m2) * 100) / 100) + ' not rentable (let at its own rate)' : '');
    var el = card.querySelector('[data-calc]');
    if (!L.start_on || (L.rent_basis !== 'spaces' && (L.rent_value == null || isNaN(L.rent_value)))) { el.textContent = ''; return; }
    var c = leaseCalc(L, cu, D.today);
    el.textContent = 'Rent now: ' + money(cur, c.rent) + ' a month excl. VAT' + (c.next ? ' · next increase ' + niceY(c.next) + ' to ' + money(cur, c.nextRent) : '');
  }
  function wireSpaces(){
    card.querySelectorAll('.sprow').forEach(function(r){
      r.querySelectorAll('[data-sp]').forEach(function(el){ el.oninput = function(){ showCalc(); card.querySelectorAll('.crow').forEach(paintRow); }; el.onchange = el.oninput; });
      r.querySelector('[data-spdel]').onclick = function(){ r.remove(); showCalc(); card.querySelectorAll('.crow').forEach(paintRow); };
    });
  }
  if (card.querySelector('[data-addsp]')) card.querySelector('[data-addsp]').onclick = function(){
    card.querySelector('[data-spaces]').insertAdjacentHTML('beforeend', spaceRow(D, { type_id: (D.space_types[0] || {}).id, area_m2: null, rate: null }));
    wireSpaces(); showCalc();
  };
  card.querySelectorAll('[data-l],[data-s]').forEach(function(el){ el.oninput = showCalc; el.onchange = showCalc; });
  wireSpaces();
  showCalc();
  // charges: show the right boxes and the estimate as things change
  function paintRow(row){
    var ct = D.charges.filter(function(c){ return c.id === Number(row.getAttribute('data-ch')); })[0];
    var r = { enabled: row.querySelector('[data-c=enabled]').checked, method: row.querySelector('[data-c=method]').value || null,
              amount: toNum(row.querySelector('[data-c=amount]').value), has_meter: row.querySelector('[data-c=has_meter]').checked,
              meter_no: row.querySelector('[data-c=meter_no]').value };
    var m = r.method || ct.method;
    row.querySelector('[data-c=method]').style.display = r.enabled ? '' : 'none';
    row.querySelector('[data-c=amount]').style.display = r.enabled && m === 'fixed' ? '' : 'none';
    row.querySelector('[data-meterbox]').style.display = r.enabled && m === 'metered' ? '' : 'none';
    row.querySelector('[data-c=meter_no]').style.display = r.enabled && m === 'metered' && r.has_meter ? '' : 'none';
    row.querySelector('.est').innerHTML = chargeEst(D, cardUnit(), ct, r, T);
    return { ct: ct, r: r };
  }
  card.querySelectorAll('.crow').forEach(function(row){
    row.querySelectorAll('[data-c]').forEach(function(el){ el.onchange = function(){ paintRow(row); }; el.oninput = el.onchange; });
    paintRow(row);
  });
  if (card.querySelector('[data-save]')) card.querySelector('[data-save]').onclick = function(){
    var m = card.querySelector('[data-m]'); m.className = 'msg'; m.textContent = 'Saving…';
    var sp = readSpaces(), oldArea = +u.area_m2 || 0, newArea = rentableOf(sp);
    var areaNote = Math.abs(oldArea - newArea) > 0.004 ? ' Rentable m² went from ' + oldArea + ' to ' + newArea + '. Shared bills are split by m², so every shop\'s share changes a little: update the month\'s drafts on Billing.' : '';
    for (var i = 0; i < sp.length; i++) {
      if (sp[i].area_m2 == null || isNaN(sp[i].area_m2) || sp[i].area_m2 <= 0) { m.className = 'msg err'; m.textContent = 'Each space needs its size in m².'; return; }
      if (sp[i].rate != null && isNaN(sp[i].rate)) { m.className = 'msg err'; m.textContent = 'A rate must be a number.'; return; }
    }
    var L = {}; card.querySelectorAll('[data-l]').forEach(function(el){ L[el.getAttribute('data-l')] = el.value; });
    rpc('ctr_unit_spaces_save', { p_centre: CID, p_code: s.code, p_unit: u.id,
        p_spaces: sp.map(function(x){ return { type_id: x.type_id, area_m2: x.area_m2, rate: x.rate }; }) }).then(function(z){
      if (!z.ok) { m.className = 'msg err'; m.textContent = z.msg; return null; }
      return rpc('ctr_space_save', { p_centre: CID, p_code: s.code, p_unit: u.id, p_name: val('[data-s=name]'), p_location: val('[data-s=location]'), p_area: rentableOf(sp) || null });
    }).then(function(x){
      if (!x) return;
      if (!x.ok) { m.className = 'msg err'; m.textContent = x.msg; return; }
      if ((u.vacant || !l) && !L.tenant_name.trim()) { done('Unit saved.' + areaNote); return; }
      rpc('ctr_lease_save', { p_centre: CID, p_code: s.code, p_unit: u.id, p_lease: L }).then(function(y){
        if (!y.ok) { m.className = 'msg err'; m.textContent = y.msg; return; }
        done((y.code ? 'Lease saved. ' + L.shop_name + ' is on the door; its shop code is ' + y.code + '.' : 'Lease saved.') + areaNote);
      });
    });
  };
  var leave = card.querySelector('[data-leave]');
  if (leave) leave.onclick = function(){
    var slot = card.querySelector('.slot');
    slot.innerHTML = '<div class="ask">' + esc(u.name) + ' leaves. The lease is closed, the shop goes off the door and its code stops working.' +
      '<label style="color:inherit">Last day</label><input type="date" data-end value="' + D.today + '">' +
      '<div class="btns"><div class="b sm no" data-y>Yes, close the lease</div><div class="b sm" data-n>No</div></div><div class="msg" data-mm></div></div>';
    slot.querySelector('[data-n]').onclick = function(){ slot.innerHTML = ''; };
    slot.querySelector('[data-y]').onclick = function(){
      rpc('ctr_lease_end', { p_centre: CID, p_code: s.code, p_lease: l.id, p_ended_on: slot.querySelector('[data-end]').value || null }).then(function(x){
        if (!x.ok) { var mm = slot.querySelector('[data-mm]'); mm.className = 'msg err'; mm.textContent = x.msg; return; }
        done('Lease closed. ' + u.name + ' is now an empty unit.');
      });
    };
  };
  if (card.querySelector('[data-csave]')) card.querySelector('[data-csave]').onclick = function(){
    var cm = card.querySelector('[data-cm]'), jobs = [];
    var rows = Array.prototype.slice.call(card.querySelectorAll('.crow'));
    for (var i = 0; i < rows.length; i++) {
      var p = paintRow(rows[i]), old = chargeRow(D, u, p.ct), r = p.r;
      if (r.amount != null && isNaN(r.amount)) { cm.className = 'msg err'; cm.textContent = p.ct.name + ': the amount must be a number.'; return; }
      var same = !!old.enabled === r.enabled && (old.method || null) === r.method && (old.amount == null ? null : +old.amount) === r.amount &&
                 !!old.has_meter === r.has_meter && (old.meter_no || '') === r.meter_no;
      if (!same) jobs.push({ p_centre: CID, p_code: s.code, p_unit: u.id, p_charge: p.ct.id, p_enabled: r.enabled, p_method: r.method,
                             p_amount: r.amount, p_has_meter: r.has_meter, p_meter_no: r.meter_no });
    }
    if (!jobs.length) { cm.className = 'msg ok'; cm.textContent = 'Nothing changed.'; return; }
    cm.className = 'msg'; cm.textContent = 'Saving…';
    (function next(i){
      if (i >= jobs.length) { done('Charges saved for ' + u.name + '.'); return; }
      rpc('ctr_unit_charge_save', jobs[i]).then(function(x){
        if (!x.ok) { cm.className = 'msg err'; cm.textContent = x.msg; return; }
        next(i + 1);
      });
    })(0);
  };
}

function rentRollCsv(D, T){
  var cur = D.centre.currency, today = D.today;
  var q = function(v){ v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  var rows = [['Unit','Where','Rentable m2','Spaces','Tenant','Contact','Phone','Start','End','Rent basis','Rent at start','Rent now (' + cur + ' excl VAT)',
               'Yearly increase %','Next increase','Rent after next increase','Deposit','Deposit held as','State']];
  D.units.forEach(function(u){
    var l = T.leaseOf[u.id];
    if (u.vacant || !l) { rows.push([u.name, u.location, u.area_m2, spacesText(u), '','', '', '', '', '', '', '', '', '', '', '', '', 'Empty']); return; }
    var c = leaseCalc(l, u, today);
    rows.push([u.name, u.location, u.area_m2, spacesText(u), l.tenant_name, l.contact, l.phone, l.start_on, l.end_on,
               l.rent_basis === 'spaces' ? 'from the spaces' : l.rent_basis === 'm2' ? 'per m2' : 'per month',
               (l.rent_basis === 'spaces' ? spacesRent(u) : +l.rent_value).toFixed(2), c.rent.toFixed(2), +l.increase_pct, c.next || '', c.next ? c.nextRent.toFixed(2) : '', (+l.deposit).toFixed(2), l.deposit_kind,
               { past: 'Past its end', ending: 'Ends in ' + c.toEnd + ' days', starts: 'Not started', running: 'Running' }[c.state]]);
  });
  var csv = '﻿' + rows.map(function(r){ return r.map(q).join(','); }).join('\r\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'Rent roll ' + D.centre.name.replace(/[\\/:*?"<>|]+/g, '-') + ' ' + today + '.csv';
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

function ownerCharges(box, s, top){

var MONTHS_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function monthName(p){ var d = ymd(p); return MONTHS_LONG[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); }
function monthStart(s){ return String(s).slice(0,7) + '-01'; }
function addMonths(p, n){ var d = ymd(p); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() + n); return d.toISOString().slice(0,10); }
function monthEnd(p){ return addDays(addMonths(p, 1), -1); }
function r2(n){ return Math.round((+n + Number.EPSILON) * 100) / 100; }

// the tenant's account: invoices (debits) and payments (credits) in date order, running balance,
// and what is still unpaid by age (payments clear the oldest invoice first)
function ledger(invoices, payments, today){
  var rows = [];
  invoices.forEach(function(i){ rows.push({ date: i.inv_date, kind: 'inv', ref: i.number, desc: i.status === 'void' ? 'Invoice (cancelled: ' + (i.void_reason || '') + ')' : 'Invoice ' + monthName(i.period),
                                            debit: i.status === 'void' ? 0 : +i.total, credit: 0, inv: i }); });
  payments.forEach(function(p){ rows.push({ date: p.paid_on, kind: 'pay', ref: p.reference || '', desc: 'Payment received', debit: 0, credit: +p.amount, pay: p }); });
  rows.sort(function(a, b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.kind === 'inv' ? -1 : 1); });
  var bal = 0; rows.forEach(function(r){ bal = r2(bal + r.debit - r.credit); r.balance = bal; });
  var paid = payments.reduce(function(s, p){ return s + +p.amount; }, 0);
  var age = { cur: 0, d30: 0, d60: 0, d90: 0 };
  invoices.filter(function(i){ return i.status === 'sent'; }).sort(function(a, b){ return a.inv_date < b.inv_date ? -1 : 1; }).forEach(function(i){
    var left = +i.total, take = Math.min(paid, left); paid -= take; left = r2(left - take);
    if (left <= 0) return;
    var d = daysTo(i.inv_date, today);
    if (d >= 90) age.d90 += left; else if (d >= 60) age.d60 += left; else if (d >= 30) age.d30 += left; else age.cur += left;
  });
  Object.keys(age).forEach(function(k){ age[k] = r2(age[k]); });
  return { rows: rows, balance: bal, age: age };
}

function loadPdf(){

  pdfReady = add('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')

}
function pdfText(s){ return String(s == null ? '' : s).replace(/→/g, 'to').replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/ /g, ' '); }
function pmoney(cur, n){ return pdfText(money(cur, n)); }
function fillC(doc, c){ doc.setFillColor(c[0], c[1], c[2]); }
function textC(doc, c){ doc.setTextColor(c[0], c[1], c[2]); }
function drawC(doc, c){ doc.setDrawColor(c[0], c[1], c[2]); }

// an invoice line's text: "Main\ndetail" (new) or old one-line text split into main + detail
function splitDesc(d){
  d = String(d || '');
  var nl = d.indexOf('\n');
  if (nl >= 0) return [d.slice(0, nl), d.slice(nl + 1)];
  var m = d.match(/^(.*?) \((.*)\)$/); if (m) return [m[1], m[2]];
  m = d.match(/^(.*?) (meter .*)$/i); if (m) return [m[1], m[2].charAt(0).toUpperCase() + m[2].slice(1)];
  m = d.match(/^Rent ([a-z ]+?) ([\d.]+ m² × .*?) · (.*)$/); if (m) return ['Rent – ' + m[1], m[2] + ' · ' + m[3]];
  return [d, ''];
}
function lineGroup(main, detail){
  if (/^Rent/.test(main)) return 'Rent';
  if (/^Meter /i.test(detail)) return 'Metered utilities';
  return 'Charges and recoveries';
}
function descHtml(d){ var p = splitDesc(d); return esc(p[0]) + (p[1] ? '<div class="est" style="margin-top:2px">' + esc(p[1]) + '</div>' : ''); }

// letterhead: company on the left, the document's name on the right, a brand rule with a gold accent
function pdfTop(doc, lh, title, sub, subColour){
  var W = PDF.W, M = PDF.M, y = M + 2;
  doc.setFont('helvetica', 'bold').setFontSize(15); textC(doc, PDF.ink); doc.text(pdfText(lh.legal_name || lh.name), M, y + 4);
  doc.setFont('helvetica', 'normal').setFontSize(8.5); textC(doc, PDF.grey);

               lh.vat_registered && lh.vat_no ? 'VAT registration no. ' + lh.vat_no : ''].filter(Boolean);
  lines.forEach(function(t, i){ doc.text(pdfText(t), M, y + 10 + i * 4.2); });
  doc.setFont('helvetica', 'bold').setFontSize(22); textC(doc, PDF.brand); doc.text(title, W - M, y + 6, { align: 'right' });
  if (sub) { doc.setFontSize(10.5); textC(doc, subColour || PDF.ink); doc.text(pdfText(sub), W - M, y + 13, { align: 'right' }); }
  y = Math.max(y + 14 + lines.length * 4.2, y + 22);

function pdfPanels(doc, y, leftLabel, leftLines, rightRows){

function waNumber(phone, cur){
  var d = String(phone || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.charAt(0) === '0') d = (cur === 'R' ? '27' : '268') + d.slice(1);
  return d.length >= 9 ? d : '';
}
function pdfOut(doc, name, title, how, msgEl, contact){
  function say(t, err){ if (msgEl) { msgEl.className = 'msg ' + (err ? 'err' : 'ok'); msgEl.textContent = t; } }
  contact = contact || {};
  var file = null;
  try { file = new File([doc.output('blob')], name, { type: 'application/pdf' }); } catch (e) {}
  var phoneLike = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if ((how === 'share' || ((how === 'wa' || how === 'mail') && phoneLike)) && file && navigator.canShare && navigator.canShare({ files: [file] })) {
    return navigator.share({ files: [file], title: title, text: contact.text || title }).then(function(){ say('Sent.'); },
      function(e){ if (!e || e.name !== 'AbortError') { doc.save(name); say('PDF downloaded. Attach it to your message.'); } });
  }
  doc.save(name);
  if (how === 'wa') {
    window.open('https://wa.me/' + waNumber(contact.phone, contact.cur) + '?text=' + encodeURIComponent(contact.text || title), '_blank');
    say('PDF downloaded. WhatsApp is opening with the message: attach the PDF (drag it into the chat).');
  } else if (how === 'mail') {
    location.href = 'mailto:' + encodeURIComponent(contact.email || '') + '?subject=' + encodeURIComponent(title) + '&body=' + encodeURIComponent(contact.text || '');
    say('PDF downloaded. Your email is opening: attach the PDF before sending.');
  } else {
    say(how === 'share' ? 'PDF downloaded. Attach it to your email or message.' : 'PDF downloaded.');
  }
  return Promise.resolve();
}

// ---------- the month's invoices, worked out from leases + charges + this month's bills and readings ----------
function computeRun(D, lh, period, inp){
  var p0 = period, p1 = monthEnd(period), dim = daysTo(p0, p1) + 1, T = mgmtTotals(D), cur = lh.currency;
  var vatOn = !!lh.vat_registered, out = [], warn = [], warned = {};
  var bills = {}; (inp.bills || []).forEach(function(b){ if (b.amount != null && b.amount !== '') bills[b.charge_id] = +b.amount; });
  var reads = {}; (inp.readings || []).forEach(function(r){ reads[r.unit_id + '_' + r.charge_id] = r; });
  D.units.forEach(function(u){
    var l = T.leaseOf[u.id];
    if (u.vacant || !l || l.start_on > p1) return;
    var from = l.start_on > p0 ? l.start_on : p0, days = daysTo(from, p1) + 1, f = days / dim, part = f < 1 ? ' (' + days + ' of ' + dim + ' days)' : '';
    var area = +u.area_m2 || 0, lines = [];
    if (l.end_on && l.end_on < p0) warn.push(u.name + ': lease ended ' + niceY(l.end_on) + '; billed at the current rent until a new lease is saved.');
    var lc = leaseCalc(l, u, from);
    if (l.rent_basis === 'spaces' && (u.spaces || []).length) {   // one rent line per space (rate after the yearly increases)
      u.spaces.forEach(function(sp){
        var rt = r2(spaceRate(sp) * lc.esc);
        lines.push({ description: 'Rent – ' + (sp.type ? sp.type.name.toLowerCase() : 'space') + '\n' + (+sp.area_m2) + ' m² × ' + money(cur, rt) + ' per m² · ' + monthName(p0) + part,
                     amount: r2(+sp.area_m2 * rt * f), vat_rate: vatOn ? 15 : 0 });
      });
    } else {
      lines.push({ description: 'Rent\n' + monthName(p0) + part + (area ? ' · ' + area + ' m² · ' + money(cur, r2(lc.rent / area)) + ' per m²' : ''), amount: r2(lc.rent * f), vat_rate: vatOn ? 15 : 0 });
    }
    D.charges.forEach(function(ct){
      var row = chargeRow(D, u, ct); if (!row.enabled) return;
      var m = row.method || ct.method, vr = vatOn && ct.vat ? 15 : 0;
      if (m === 'metered' && !row.has_meter) m = 'share';
      if (m === 'off') return;
      if (m === 'fixed') { var a = (row.amount != null ? +row.amount : +ct.rate) * f; if (a) lines.push({ description: ct.name + (part ? '\n' + part.trim() : ''), amount: r2(a), vat_rate: vr }); return; }
      if (m === 'per_m2') { if (!area) { warn.push(u.name + ': ' + ct.name + ' needs the m².'); return; }
        if (+ct.rate) lines.push({ description: ct.name + '\n' + area + ' m² × ' + money(cur, +ct.rate) + ' per m²' + part, amount: r2(area * ct.rate * f), vat_rate: vr }); return; }
      if (m === 'share') {
        if (!(ct.id in bills)) { if (!warned[ct.id]) { warn.push('No centre bill entered for ' + ct.name + ', so it is left off.'); warned[ct.id] = 1; } return; }
        if (!area || !T.basis) { warn.push(u.name + ': ' + ct.name + ' needs the m².'); return; }
        var pc = area / T.basis;
        lines.push({ description: ct.name + '\n' + (Math.round(pc * 10000) / 100) + '% of the centre\'s ' + money(cur, bills[ct.id]) + ' (your share by m²)', amount: r2(bills[ct.id] * pc), vat_rate: vr }); return; }
      if (m === 'metered') {
        var rd = reads[u.id + '_' + ct.id];
        if (!rd || rd.curr == null || rd.curr === '' || rd.prev == null || rd.prev === '') { warn.push(u.name + ': no ' + ct.name.toLowerCase() + ' reading, so it is left off.'); return; }
        var used = +rd.curr - +rd.prev;
        if (used < 0) { warn.push(u.name + ': the ' + ct.name.toLowerCase() + ' reading is lower than last month; left off.'); return; }
        if (+rd.prev === 0) warn.push(u.name + ': the last ' + ct.name.toLowerCase() + ' reading is 0. If this is the meter\'s first month, type its reading on the day the lease started as the last reading.');
        lines.push({ description: ct.name + '\nMeter ' + (row.meter_no || '') + ': ' + rd.prev + ' to ' + rd.curr + ' = ' + r2(used) + ' units × ' + money(cur, +ct.rate) + (+ct.basic ? ' + basic ' + money(cur, +ct.basic) : ''),
                     amount: r2(used * ct.rate + +ct.basic), vat_rate: vr });
      }
    });
    (inp.extras || []).forEach(function(x){ if (x.unit_id === u.id) lines.push({ description: x.description, amount: r2(+x.amount), vat_rate: vatOn && x.vat ? 15 : 0 }); });
    out.push({ unit_id: u.id, lease_id: l.id, unit: u.name, tenant: l.tenant_name, lines: lines.filter(function(x){ return x.amount !== 0; }) });
  });
  return { invoices: out, warnings: warn };
}

var BILL_PERIOD = null, BILL_OPEN = null;
// a draft is out of date when the shop's lease, spaces or charges changed after it was made
function draftStale(inv, fresh){
  if (!fresh) return true;
  var a = r2(fresh.lines.reduce(function(t, l){ return t + +l.amount; }, 0));
  return Math.abs(a - +inv.subtotal) > 0.004 || fresh.lines.length !== inv.lines.length;
}
function staleList(D, lh, B){
  if (!B || !B.run || !B.run.id || B.run.status === 'sent') return [];
  var c = computeRun(D, lh, B.period, B.run.inputs || {}), fresh = {}, out = [];
  c.invoices.forEach(function(x){ fresh[x.unit_id] = x; });
  B.invoices.forEach(function(i){ if (i.status === 'draft' && draftStale(i, fresh[i.unit_id])) out.push(i.unit_name); });
  c.invoices.forEach(function(x){ if (!B.invoices.some(function(i){ return i.unit_id === x.unit_id; })) out.push(x.unit + ' (new)'); });
  return out;
}
// make the month's drafts again with the same bills, readings and once-off lines (after a lease or charge changed)
function remakeDrafts(D, lh, B, s){
  var inp = B.run.inputs || {}, c = computeRun(D, lh, B.period, inp);
  return rpc('ctr_run_save', { p_centre: CID, p_code: s.code, p_period: B.period, p_inputs: inp,
    p_invoices: c.invoices.map(function(i){ return { unit_id: i.unit_id, lease_id: i.lease_id, lines: i.lines }; }) });
}
function ownerBilling(box, s, top){
  box.innerHTML = '<div class="loading">Loading…</div>';

    if (!D.ok) { box.innerHTML = '<div class="msg err">' + esc(D.msg) + '</div>'; return; }
    var thisMonth = monthStart(D.today);
    var first = !BILL_PERIOD;
    if (first) BILL_PERIOD = thisMonth;
    rpc('ctr_billing_home', { p_centre: CID, p_code: s.code, p_period: BILL_PERIOD }).then(function(B){
      if (!B.ok) { box.innerHTML = '<div class="msg err">' + esc(B.msg) + '</div>'; return; }
      // first time in: open on the first month not yet sent (this month, or next month once this month is sent)
      if (first && B.run && B.run.status === 'sent') { BILL_PERIOD = addMonths(thisMonth, 1); return ownerBilling(box, s, top); }
      drawBilling(box, s, top, D, B);
    });
  });
}

function drawBilling(box, s, top, D, B){
  var lh = B.letterhead, cur = lh.currency, run = B.run, sent = run && run.status === 'sent', period = B.period, T = mgmtTotals(D);
  var inp = run ? run.inputs : { bills: [], readings: [], extras: [] };
  inp.bills = inp.bills || []; inp.readings = inp.readings || []; inp.extras = inp.extras || [];
  var lastRead = {}; B.last_readings.forEach(function(r){ lastRead[r.unit_id + '_' + r.charge_id] = r.curr; });
  var billed = D.units.filter(function(u){ var l = T.leaseOf[u.id]; return !u.vacant && l && l.start_on <= monthEnd(period); });
  // which charges need a centre bill, and which meters need a reading

        return '<option value="' + p + '"' + (p === period ? ' selected' : '') + '>' + monthName(p) + (r ? (r.status === 'sent' ? ' · sent' : ' · draft') : '') + '</option>'; }).join('') +
