        return '<label>' + esc(ct.name) + ' · the centre\'s bill (' + cur + ', excl. VAT)' + (ct.method === 'metered' ? ' · shared only by shops without a meter' : '') +
          '</label><input data-bill="' + id + '" inputmode="decimal" value="' + esc(b && b.amount != null ? b.amount : '') + '">';
      }).join('') + '<div class="hint">Each shop pays its share by m² (' + (D.centre.share_basis === 'let' ? 'let m² only' : 'whole centre') + '). Leave empty to leave a charge off this month.</div></div>'
      : '<div class="box empty">No shared bills this month.</div>') +
      '<div class="h3">2 · Meter readings</div>' +
      (meters.length ? '<div class="box">' + meters.map(function(x){
        var key = x.u.id + '_' + x.ct.id, r = inp.readings.filter(function(y){ return y.unit_id === x.u.id && y.charge_id === x.ct.id; })[0];
        var prev = r && r.prev != null ? r.prev : (key in lastRead ? lastRead[key] : '');
        return '<div class="crow" data-read="' + key + '"><div class="nm">' + esc(x.u.name) + ' · ' + esc(x.ct.name) + (x.row.meter_no ? ' · ' + esc(x.row.meter_no) : '') + '</div>' +
          '<div class="two"><div><label>Last reading</label><input data-prev inputmode="decimal" value="' + esc(prev) + '"></div>' +
          '<div><label>This reading</label><input data-curr inputmode="decimal" value="' + esc(r && r.curr != null ? r.curr : '') + '"></div></div></div>';
      }).join('') + '</div>' : '<div class="box empty">No meters.</div>') +
      '<div class="h3">3 · Once-off lines</div><div class="box"><div id="blExtras">' +
        (inp.extras.length ? inp.extras.map(function(x, i){ var u = D.units.filter(function(v){ return v.id === x.unit_id; })[0];
          return '<div class="crow"><div class="hd"><span>' + esc(u ? u.name : '?') + ': ' + esc(x.description) + ' · ' + money(cur, +x.amount) + (x.vat ? ' + VAT' : '') + '</span>' +
            '<span class="b sm no" data-xdel="' + i + '">Remove</span></div></div>'; }).join('') : '<div class="empty">None.</div>') +
        '</div><label>Shop</label><select id="xU">' + billed.map(function(u){ return '<option value="' + u.id + '">' + esc(u.name) + '</option>'; }).join('') + '</select>' +
        '<div class="two"><div><label>Description</label><input id="xD" maxlength="80" placeholder="e.g. Key replacement"></div><div><label>Amount (' + cur + ', excl. VAT)</label><input id="xA" inputmode="decimal"></div></div>' +
        '<label class="chk" style="margin-top:10px"><input type="checkbox" id="xV" checked> Add VAT</label>' +
        '<div class="btns"><div class="b sm" id="xAdd">Add line</div></div></div>' +
      '<div class="b main wide" id="blMake">' + (run && run.id ? 'Make the drafts again' : 'Make draft invoices') + '</div><div class="msg" id="blMsg"></div><div id="blWarn"></div>';
  }
  var stale = staleList(D, lh, B); D_CUR = cur;
  // the rent on a draft, the shop's rentable m² and the rent per m²
  function rentInfo(i){
    var u = D.units.filter(function(x){ return x.id === i.unit_id; })[0], rent = i.lines.filter(function(l){ return /^Rent/.test(l.description); }).reduce(function(t, l){ return t + +l.amount; }, 0);
    return rent && u ? '<div class="mt">Rent ' + money(cur, r2(rent)) + ' · ' + m2s(u.area_m2) + ' · ' + perM2(rent, +u.area_m2) + '</div>' : '';
  }
  if (invs.length) {
    html += (stale.length ? '<div class="ask" style="margin-top:14px">⚠ Changed after the drafts were made (lease, spaces or charges): <b>' + stale.map(esc).join(', ') + '</b>.' +
              '<div style="margin-top:6px;font-size:13px">Shared bills are split by m²: when one shop\'s m² changes, every shop\'s share changes a little. That is why other shops show here too.</div>' +
              '<div class="btns"><div class="b sm main" id="blUpd">Update the drafts</div></div><div class="msg" id="blUpdM"></div></div>' : '') +
      '<div class="h3">' + (sent ? 'Invoices sent' : 'Draft invoices') + ' · ' + invs.length + '</div>' +
      '<input id="blFind" placeholder="Find a shop: type the first letters" autocomplete="off" style="margin-bottom:6px">' +
      '<div class="tiles"><div class="tile"><div class="k">Excl. VAT</div><div class="v">' + money(cur, totals.s) + '</div></div>' +
      '<div class="tile"><div class="k">Total incl. VAT</div><div class="v">' + money(cur, totals.t) + '</div><div class="s">VAT ' + money(cur, totals.v) + '</div></div></div>' +
      invs.map(function(i){
        return '<div class="item rr" data-inv="' + i.id + '" data-uname="' + esc(i.unit_name) + '"><div class="top" data-iopen="' + i.id + '"><div><div class="ti">' + esc(i.unit_name) +
          (stale.indexOf(i.unit_name) >= 0 ? ' <span class="st rejected">Out of date</span>' : '') + '</div>' +
          '<div class="mt">' + esc(i.tenant_name) + (i.number ? ' · ' + esc(i.number) : '') + '</div>' + rentInfo(i) + '</div><div style="text-align:right"><div class="amt">' + money(cur, +i.total) + '</div>' +
          (i.status === 'void' ? '<span class="st rejected">Cancelled</span>' : i.status === 'sent' ? '<span class="st approved">Sent</span>' : '<span class="st pending">Draft</span>') + '</div></div>' +
          (BILL_OPEN === i.id ? '<div class="box" style="margin-top:10px;cursor:default" data-icard>' + i.lines.map(function(l){
              return '<div class="crow"><div class="hd"><span style="font-size:13px">' + descHtml(l.description) + '</span><b style="white-space:nowrap">' + money(cur, +l.amount) + '</b></div>' +
                (+l.vat_rate ? '<div class="est">+ VAT ' + money(cur, +l.vat) + '</div>' : '<div class="est">no VAT</div>') + '</div>'; }).join('') +
            '<div class="crow"><div class="hd"><b>Total incl. VAT</b><b>' + money(cur, +i.total) + '</b></div></div>' +
            '<div class="btns">' + (i.status === 'draft' ? '<div class="b sm" data-ipdf="save">Draft PDF</div>' : sendBtns('data-ipdf')) +
            (i.status === 'sent' ? '<div class="b sm no" data-ivoid>Cancel invoice</div>' : '') + '<div class="b sm" data-go="#unit/' + i.unit_id + '/invoices">Open the shop page ›</div></div><div class="slot"></div><div class="msg" data-im></div></div>' : '') +
        '</div>';
      }).join('');
    if (!sent) html += '<div class="b ok wide" id="blSend">Send all ' + invs.length + ' invoices</div><div class="slot" id="blSendSlot"></div>';
  }
  html += '<div class="hint" style="margin-top:16px">Letterhead, bank details and invoice numbers: ⚙️ Settings → Invoices.</div>' +
    '<div class="b wide" id="out">Log out</div>';
  box.innerHTML = html;

  function readInputs(){
    var o = { bills: [], readings: [], extras: inp.extras.slice() }, bad = null;
    box.querySelectorAll('[data-bill]').forEach(function(el){ var v = toNum(el.value); if (v != null && (isNaN(v) || v < 0)) bad = 'A bill amount is not a number.'; if (v != null) o.bills.push({ charge_id: Number(el.getAttribute('data-bill')), amount: v }); });
    box.querySelectorAll('[data-read]').forEach(function(el){ var k = el.getAttribute('data-read').split('_'), pv = toNum(el.querySelector('[data-prev]').value), cv = toNum(el.querySelector('[data-curr]').value);
      if ((pv != null && isNaN(pv)) || (cv != null && isNaN(cv))) bad = 'A meter reading is not a number.';
      o.readings.push({ unit_id: Number(k[0]), charge_id: Number(k[1]), prev: pv, curr: cv }); });
    return bad ? { bad: bad } : o;
  }
  var fnd = $('blFind'); if (fnd) fnd.oninput = function(){
    box.querySelectorAll('[data-uname]').forEach(function(el){ el.style.display = startsIn(el.getAttribute('data-uname'), fnd.value) ? '' : 'none'; });
  };
  var upd = $('blUpd'); if (upd) upd.onclick = function(){
    $('blUpdM').className = 'msg'; $('blUpdM').textContent = 'Updating…';
    remakeDrafts(D, lh, B, s).then(function(x){
      if (!x.ok) { $('blUpdM').className = 'msg err'; $('blUpdM').textContent = x.msg; return; }
      BILL_OPEN = null; ownerBilling(box, s, '<div class="msg ok">Drafts updated with the latest leases, spaces and charges (same bills and readings).</div>');
    });
  };
  var mon = $('blMonth'); if (mon) mon.onchange = function(){ BILL_PERIOD = mon.value; BILL_OPEN = null; ownerBilling(box, s, ''); };
  var xa = $('xAdd'); if (xa) xa.onclick = function(){
    var a = toNum($('xA').value), d = $('xD').value.trim();
    if (!d || a == null || isNaN(a)) { $('blMsg').className = 'msg err'; $('blMsg').textContent = 'Fill in the description and amount of the once-off line.'; return; }
    inp.extras.push({ unit_id: Number($('xU').value), description: d, amount: a, vat: $('xV').checked });
    var keep = readInputs(); if (!keep.bad) { inp.bills = keep.bills; inp.readings = keep.readings; }
    drawBilling(box, s, '', D, Object.assign({}, B, { run: Object.assign({}, run || { status: 'draft' }, { inputs: inp }) }));
  };
  box.querySelectorAll('[data-xdel]').forEach(function(el){ el.onclick = function(){
    inp.extras.splice(Number(el.getAttribute('data-xdel')), 1);
    var keep = readInputs(); if (!keep.bad) { inp.bills = keep.bills; inp.readings = keep.readings; }
    drawBilling(box, s, '', D, Object.assign({}, B, { run: Object.assign({}, run || { status: 'draft' }, { inputs: inp }) }));
  }; });
  var mk = $('blMake'); if (mk) mk.onclick = function(){
    var m = $('blMsg'), o = readInputs();
    if (o.bad) { m.className = 'msg err'; m.textContent = o.bad; return; }
    var c = computeRun(D, lh, period, o);
    if (!c.invoices.length) { m.className = 'msg err'; m.textContent = 'There are no leases to bill for ' + monthName(period) + '.'; return; }
    m.className = 'msg'; m.textContent = 'Making ' + c.invoices.length + ' draft invoices…';
    rpc('ctr_run_save', { p_centre: CID, p_code: s.code, p_period: period, p_inputs: o,
        p_invoices: c.invoices.map(function(i){ return { unit_id: i.unit_id, lease_id: i.lease_id, lines: i.lines }; }) }).then(function(x){
      if (!x.ok) { m.className = 'msg err'; m.textContent = x.msg; return; }
      BILL_OPEN = null;
      ownerBilling(box, s, '<div class="msg ok">' + x.drafts + ' draft invoices made for ' + monthName(period) + '. Check them below, then send.</div>' +
        (c.warnings.length ? '<div class="ask" style="margin-top:10px"><b>Please check:</b><br>' + c.warnings.map(esc).join('<br>') + '</div>' : ''));
    });
  };
  var sd = $('blSend'); if (sd) sd.onclick = function(){
    var slot = $('blSendSlot');
    slot.innerHTML = '<div class="ask">Send all ' + invs.length + ' invoices for ' + monthName(period) + '? They get their numbers and can no longer be changed.' +
      '<label style="color:inherit">Invoice date</label><input type="date" data-d value="' + period + '">' +
      '<div class="btns"><div class="b sm ok" data-y>Yes, send them</div><div class="b sm" data-n>No</div></div><div class="msg" data-m></div></div>';
    slot.querySelector('[data-n]').onclick = function(){ slot.innerHTML = ''; };
    slot.querySelector('[data-y]').onclick = function(){
      rpc('ctr_run_send', { p_centre: CID, p_code: s.code, p_period: period, p_inv_date: slot.querySelector('[data-d]').value || null }).then(function(x){
        if (!x.ok) { var mm = slot.querySelector('[data-m]'); mm.className = 'msg err'; mm.textContent = x.msg; return; }
        BILL_OPEN = null;
        ownerBilling(box, s, '<div class="msg ok">' + x.sent + ' invoices sent and numbered. Tap one to send its PDF; tenants also see them on My shop.</div>');
      });
    };
  };
  box.querySelectorAll('[data-iopen]').forEach(function(el){ el.onclick = function(){
    var id = Number(el.getAttribute('data-iopen')); BILL_OPEN = BILL_OPEN === id ? null : id; drawBilling(box, s, top, D, B);
  }; });
  var card = box.querySelector('[data-icard]');
  if (card) {
    var inv = invs.filter(function(i){ return i.id === BILL_OPEN; })[0], im = card.querySelector('[data-im]');
    card.querySelectorAll('[data-ipdf]').forEach(function(b){ b.onclick = function(){
      var le = D.leases.filter(function(x){ return x.id === inv.lease_id; })[0] || {};
      withPdf(im, function(){ return pdfOut(buildInvoicePdf(inv, lh), invoiceFileName(inv, lh), (lh.vat_registered ? 'Tax invoice ' : 'Invoice ') + (inv.number || 'draft'), b.getAttribute('data-ipdf'), im,
        { phone: le.phone, email: le.email, cur: lh.currency, text: invMsg(inv, lh, le.contact) }); });
    }; });
    var vd = card.querySelector('[data-ivoid]');
    if (vd) vd.onclick = function(){
      var slot = card.querySelector('.slot');
      slot.innerHTML = '<div class="ask">Cancel invoice ' + esc(inv.number) + '? It stays on record as cancelled and comes off the tenant\'s statement.' +
        '<input data-why maxlength="200" style="margin-top:8px" placeholder="Reason, e.g. wrong rent">' +
        '<div class="btns"><div class="b sm no" data-y>Yes, cancel it</div><div class="b sm" data-n>No</div></div><div class="msg" data-m></div></div>';
      slot.querySelector('[data-n]').onclick = function(){ slot.innerHTML = ''; };
      slot.querySelector('[data-y]').onclick = function(){
        rpc('ctr_invoice_void', { p_centre: CID, p_code: s.code, p_id: inv.id, p_reason: slot.querySelector('[data-why]').value }).then(function(x){
          if (!x.ok) { var mm = slot.querySelector('[data-m]'); mm.className = 'msg err'; mm.textContent = x.msg; return; }
          ownerBilling(box, s, '<div class="msg ok">Invoice ' + esc(inv.number) + ' cancelled.</div>');
        });
      };
    };
  }
  $('out').onclick = function(){ setSess(null); bar(); go('#'); };
}

// ---------- statements and payments ----------
var ST_OPEN = null;
function ownerStatements(box, s, top){
  box.innerHTML = '<div class="loading">Loading…</div>';
  rpc('ctr_statements_home', { p_centre: CID, p_code: s.code }).then(function(S){
    if (!S.ok) { box.innerHTML = '<div class="msg err">' + esc(S.msg) + '</div>'; return; }
    var lh = S.letterhead, cur = lh.currency, today = S.today, owed = 0, over30 = 0, over90 = 0;
    var rows = S.leases.map(function(l){
      var L = ledger(S.invoices.filter(function(i){ return i.lease_id === l.id; }), S.payments.filter(function(p){ return p.lease_id === l.id; }), today);
      owed += Math.max(0, L.balance); over30 += L.age.d30 + L.age.d60 + L.age.d90; over90 += L.age.d90;
      return { l: l, L: L };
    });
    box.innerHTML = top +
      '<div class="tiles"><div class="tile"><div class="k">Owed to the centre</div><div class="v">' + money(cur, owed) + '</div></div>' +
      '<div class="tile"><div class="k">30 days and older</div><div class="v">' + money(cur, r2(over30)) + '</div><div class="s">' + money(cur, r2(over90)) + ' is 90+ days</div></div></div>' +
      '<div class="h3">Tenants</div>' +
      wideT(['Unit', 'Tenant', 'Current', '30 days', '60 days', '90+ days', 'Balance', ''], rows.map(function(x){
        var l = x.l, L = x.L;
        return { go: l.ended_on ? null : '#unit/' + l.unit_id + '/statement',
                 cells: ['<b>' + esc(l.unit) + '</b>' + (l.ended_on ? ' <span class="hint">(left)</span>' : ''), esc(l.tenant_name), money(cur, L.age.cur), money(cur, L.age.d30),
                         money(cur, L.age.d60), money(cur, L.age.d90), '<b>' + money(cur, L.balance) + '</b>', balPill(L)], right: [2, 3, 4, 5, 6] };
      })) + '<div class="narrow-only">' +
      rows.map(function(x){
        var l = x.l, L = x.L, pill = L.balance > 0.004 ? (L.age.d30 + L.age.d60 + L.age.d90 > 0 ? '<span class="st rejected">Behind</span>' : '<span class="st pending">Owes</span>')
                                 : L.balance < -0.004 ? '<span class="st approved">In credit</span>' : '<span class="st approved">Paid up</span>';
        return '<div class="item rr" data-st="' + l.id + '"><div class="top" data-sopen="' + l.id + '"><div><div class="ti">' + esc(l.unit) + (l.ended_on ? ' (left)' : '') + '</div>' +
          '<div class="mt">' + esc(l.tenant_name) + '</div>' +
          (L.age.d30 + L.age.d60 + L.age.d90 > 0 ? '<div class="mt">30d ' + money(cur, L.age.d30) + ' · 60d ' + money(cur, L.age.d60) + ' · 90d+ ' + money(cur, L.age.d90) + '</div>' : '') +
          '</div><div style="text-align:right"><div class="amt">' + money(cur, L.balance) + '</div>' + pill + '</div></div>' +
          (ST_OPEN === l.id ? stCard(l, L, cur, today) : '') + '</div>';
      }).join('') + '</div>' +
      '<div class="b wide" id="out">Log out</div>';
    box.querySelectorAll('[data-sopen]').forEach(function(el){ el.onclick = function(){
      var id = Number(el.getAttribute('data-sopen')), x = rows.filter(function(r){ return r.l.id === id; })[0];
      if (x && !x.l.ended_on) { go('#unit/' + x.l.unit_id + '/statement'); return; }   // current tenants: their own page
      ST_OPEN = ST_OPEN === id ? null : id; ownerStatements(box, s, '');
    }; });
    var card = box.querySelector('[data-scard]');
    if (card) wireStCard(card, S, rows.filter(function(r){ return r.l.id === ST_OPEN; })[0], s, function(msg){ ownerStatements(box, s, '<div class="msg ok">' + esc(msg) + '</div>'); });
    $('out').onclick = function(){ setSess(null); bar(); go('#'); };
  });
}
// the statement card's buttons: statement PDF, invoice PDFs, record / remove a payment
function wireStCard(card, S, x, s, done){
  var lh = S.letterhead, cur = lh.currency, today = S.today, sm = card.querySelector('[data-sm]');
  card.querySelectorAll('[data-spdf]').forEach(function(b){ b.onclick = function(){
    withPdf(sm, function(){ return pdfOut(buildStatementPdf(x.l, x.L, lh, today), ('Statement ' + x.l.tenant_name + ' ' + today).replace(/[\\/:*?"<>|]+/g, '-') + '.pdf',
                                          'Statement ' + x.l.tenant_name, b.getAttribute('data-spdf'), sm,
                                          { phone: x.l.phone, email: x.l.email, cur: cur, text: stMsg(x.l, x.L, lh, today, x.l.contact) }); });
  }; });
  card.querySelectorAll('[data-rinv]').forEach(function(b){ b.onclick = function(){
    var inv = S.invoices.filter(function(i){ return i.id === Number(b.getAttribute('data-rinv')); })[0];
    withPdf(sm, function(){ return pdfOut(buildInvoicePdf(inv, lh), invoiceFileName(inv, lh), 'Invoice ' + inv.number, 'share', sm); });
  }; });
  card.querySelector('[data-padd]').onclick = function(){
    var a = toNum(card.querySelector('[data-pa]').value);
    if (a == null || isNaN(a)) { sm.className = 'msg err'; sm.textContent = 'Fill in the amount received.'; return; }
    rpc('ctr_payment_add', { p_centre: CID, p_code: s.code, p_lease: x.l.id, p_paid_on: card.querySelector('[data-pd]').value || null, p_amount: a,
        p_reference: card.querySelector('[data-pr]').value, p_note: null }).then(function(r){
      if (!r.ok) { sm.className = 'msg err'; sm.textContent = r.msg; return; }
      done('Payment of ' + money(cur, a) + ' recorded for ' + x.l.unit + '.');
    });
  };
  card.querySelectorAll('[data-pdel]').forEach(function(b){ b.onclick = function(){
    var pid = Number(b.getAttribute('data-pdel'));
    askIn(card.querySelector('.slot'), 'Remove this payment?', 'Yes, remove it', function(){
      return rpc('ctr_payment_remove', { p_centre: CID, p_code: s.code, p_id: pid }).then(function(r){ if (r.ok) done('Payment removed.'); return r; });
    });
  }; });
}
function stCard(l, L, cur, today){
  return '<div class="box" style="margin-top:10px;cursor:default" data-scard>' +
    (L.rows.length ? L.rows.map(function(r){
      return '<div class="crow"><div class="hd"><span style="font-size:13px">' + niceY(r.date) + ' · ' + esc(r.desc) + (r.ref ? ' · ' + esc(r.ref) : '') + '</span>' +
        '<b style="white-space:nowrap">' + (r.debit ? money(cur, r.debit) : r.credit ? '−' + money(cur, r.credit) : '') + '</b></div>' +
        '<div class="est">Balance ' + money(cur, r.balance) +
        (r.kind === 'inv' && r.inv.status === 'sent' ? ' · <span class="lnk" data-rinv="' + r.inv.id + '" style="color:var(--brand);font-weight:600;cursor:pointer">invoice PDF</span>' : '') +
        (r.kind === 'pay' ? ' · <span data-pdel="' + r.pay.id + '" style="color:var(--bad);font-weight:600;cursor:pointer">remove</span>' : '') + '</div></div>';
    }).join('') : '<div class="empty">No invoices or payments yet.</div>') +
    '<div class="slot"></div>' +
    '<div class="sub">Send the statement</div><div class="btns">' + sendBtns('data-spdf') + '</div>' +
    '<div class="sub">Record a payment</div>' +
    '<div class="two"><div><label>Received on</label><input type="date" data-pd value="' + today + '"></div><div><label>Amount (' + cur + ')</label><input data-pa inputmode="decimal"></div></div>' +
    '<label>Reference</label><input data-pr maxlength="60" placeholder="e.g. EFT ' + esc(l.unit) + '">' +
    '<div class="btns"><div class="b sm ok" data-padd>Record payment</div></div><div class="msg" data-sm></div></div>';
}

// ---------- tenant: My account on My shop (Block 1) ----------
function shopAccount(el, s){
  rpc('ctr_shop_account', { p_centre: CID, p_code: s.code }).then(function(A){
    if (!A || !A.ok || !A.lease) { el.innerHTML = ''; return; }
    var lh = A.letterhead, cur = lh.currency, L = ledger(A.invoices, A.payments, A.today);
    el.innerHTML = '<div class="h3">My account</div><div class="box">' +
      '<div style="display:flex;justify-content:space-between;align-items:center"><div><div class="hint" style="margin:0">' + (L.balance < 0 ? 'In credit' : 'Balance due') + '</div>' +
      '<div style="font-size:22px;font-weight:800">' + money(cur, Math.abs(L.balance)) + '</div></div>' +
      '<div class="b sm main" data-acst>Statement PDF</div></div>' +
      (L.age.d30 + L.age.d60 + L.age.d90 > 0 ? '<div class="msg err" style="margin-top:10px">' + money(cur, r2(L.age.d30 + L.age.d60 + L.age.d90)) + ' is 30 days or older.</div>' : '') +
      (A.invoices.length ? A.invoices.slice().reverse().slice(0, 6).map(function(i){
        return '<div class="crow"><div class="hd"><span><b>' + esc(i.number) + '</b> · ' + monthName(i.period) + '</span><b>' + money(cur, +i.total) + '</b></div>' +
          '<div class="est"><span data-acinv="' + i.id + '" style="color:var(--brand);font-weight:600;cursor:pointer">Invoice PDF</span></div></div>'; }).join('')
        : '<div class="empty" style="margin-top:8px">No invoices yet.</div>') +
      '<div class="msg" data-acm></div></div>';
    var m = el.querySelector('[data-acm]'), lease = { tenant_name: A.lease.tenant_name, unit: A.lease.unit };
    el.querySelector('[data-acst]').onclick = function(){
      withPdf(m, function(){ return pdfOut(buildStatementPdf(lease, L, lh, A.today), ('Statement ' + lease.tenant_name + ' ' + A.today).replace(/[\\/:*?"<>|]+/g, '-') + '.pdf', 'Statement', 'share', m); });
    };
    el.querySelectorAll('[data-acinv]').forEach(function(b){ b.onclick = function(){
      var inv = A.invoices.filter(function(i){ return i.id === Number(b.getAttribute('data-acinv')); })[0];
      withPdf(m, function(){ return pdfOut(buildInvoicePdf(inv, lh), invoiceFileName(inv, lh), 'Invoice ' + inv.number, 'share', m); });
    }; });
  });
}

// =====================================================================
// e6 · THE CENTRE OFFICE: office login, office home, a page per shop ("shop file")
// =====================================================================
var LAST_TAB = 'home';

function officeLogin(){
  if (!DOOR) { APP.innerHTML = '<div class="loading">Loading…</div>'; loadDoor().then(function(){ officeLogin(); }); return; }
  var c = DOOR.centre;
  APP.innerHTML = '<div class="offwrap"><div class="offcard">' +
      '<div class="officon">🏢</div>' +
      '<div class="offname">' + esc(c.name) + '</div>' +
      '<div class="offtitle">Centre Office</div>' +
      '<div class="offsub">For the owner and the centre manager</div>' +
      '<label for="code" style="color:#cbd5e1">Owner code</label>' +
      '<input id="code" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="6 digits">' +
      '<div class="b wide offbtn" id="open">Open the office</div><div class="msg" id="m"></div>' +
    '</div>' +
    '<div style="text-align:center;margin-top:16px"><a class="backshop" href="index.html' + (CID ? '?c=' + CID : '') + '">‹ Back to the shopper page</a></div>' +
    '<div class="offhint"><b>Keep the office on your phone like an app</b><br>' +
      'iPhone (Safari): tap Share <span class="kbd">⬆</span> then <b>Add to Home Screen</b>.<br>' +
      'Android (Chrome): tap <span class="kbd">⋮</span> then <b>Add to Home screen</b> or <b>Install app</b>.</div>' +
    '<div class="foot" style="color:#94a3b8">' + ESM_BUILD + '</div></div>';
  function open(){
    var code = $('code').value.trim();
    if (!/^\d{6}$/.test(code)) { $('m').className = 'msg err'; $('m').textContent = 'The code is 6 digits.'; return; }
    $('m').className = 'msg'; $('m').textContent = 'Checking…';
    rpc('ctr_login', { p_centre: CID, p_code: code }).then(function(r){
      if (!r.ok) { $('m').className = 'msg err'; $('m').textContent = r.msg; return; }
      if (r.role !== 'owner') { $('m').className = 'msg err'; $('m').textContent = 'That is a shop code. Shops log in on the centre\'s shop page, not in the office.'; return; }
      setSess({ role: 'owner', code: code }); go('#tab/home');
    });
  }
  $('open').onclick = open;
  $('code').onkeydown = function(e){ if (e.key === 'Enter') open(); };
  $('code').focus();   // the cursor starts in the code box, so typing + Enter works straight away
}

// a wide table (laptop only; the phone keeps its cards). rows: [{go, cells:[html...], right:[column numbers]}]
function wideT(head, rows){
  return '<div class="wide-only"><table class="dt"><thead><tr>' + head.map(function(h, i){ return '<th' + (rows[0] && rows[0].right.indexOf(i) >= 0 ? ' class="r"' : '') + '>' + esc(h) + '</th>'; }).join('') +
    '</tr></thead><tbody>' + rows.map(function(r){
      return '<tr' + (r.go ? ' data-go="' + esc(r.go) + '"' : '') + '>' + r.cells.map(function(c, i){ return '<td' + (r.right.indexOf(i) >= 0 ? ' class="r"' : '') + '>' + c + '</td>'; }).join('') + '</tr>';
    }).join('') + '</tbody></table></div>';
}

function balPill(L){
  if (!L) return '';
  if (L.balance > 0.004) return L.age.d30 + L.age.d60 + L.age.d90 > 0 ? '<span class="st rejected">Behind</span>' : '<span class="st pending">Owes</span>';
  if (L.balance < -0.004) return '<span class="st approved">In credit</span>';
  return '<span class="st approved">Paid up</span>';
}

// ---------- office home: the big numbers and every shop ----------
function ownerHome(box, r, s, top){
  box.innerHTML = '<div class="loading">Loading…</div>';
  var thisMonth = null;
  mgmtLoad(s).then(function(D){
    if (!D.ok) { box.innerHTML = '<div class="msg err">' + esc(D.msg) + '</div>'; return; }
    thisMonth = monthStart(D.today);
    return Promise.all([D, rpc('ctr_statements_home', { p_centre: CID, p_code: s.code }), rpc('ctr_billing_home', { p_centre: CID, p_code: s.code, p_period: thisMonth }),
                        rpc('ctr_faults_home', { p_centre: CID, p_code: s.code })]);
  }).then(function(all){
    if (!all) return;
    var D = all[0], S = all[1], B = all[2], F = all[3], cur = D.centre.currency, today = D.today, T = mgmtTotals(D);
    var fOpen = F && F.ok ? F.faults.filter(function(f){ return f.status !== 'fixed'; }) : [], fUrg = fOpen.filter(function(f){ return f.urgency === 'urgent'; }).length;
    var logoOf = {}; r.units.forEach(function(u){ logoOf[u.id] = u; });
    var balOf = {}, owed = 0, late = 0;
    (S.ok ? S.leases : []).forEach(function(l){
      var L = ledger(S.invoices.filter(function(i){ return i.lease_id === l.id; }), S.payments.filter(function(p){ return p.lease_id === l.id; }), today);
      if (!l.ended_on) balOf[l.id] = L;
      owed += Math.max(0, L.balance); late += L.age.d30 + L.age.d60 + L.age.d90;
    });
    var roll = 0, ending = 0, past = 0;
    D.units.forEach(function(u){ var l = T.leaseOf[u.id]; if (u.vacant || !l) return; var c = leaseCalc(l, u, today);
      if (c.state !== 'starts') roll += c.rent; if (c.state === 'ending') ending++; if (c.state === 'past') past++; });
    var bill = B && B.ok ? (B.run ? (B.run.status === 'sent' ? 'Sent ✓' : 'Drafts made') : 'Not made yet') : '—';
    var occ = T.all ? Math.round(T.let_ / T.all * 100) : 0;
    box.innerHTML = top +
      '<div class="hometiles">' +
        '<div class="htile" data-go="#tab/statements"><div class="k">Owed to the centre</div><div class="v">' + money(cur, r2(owed)) + '</div><div class="s">' + money(cur, r2(late)) + ' is 30+ days</div></div>' +
        '<div class="htile" data-go="#tab/leases"><div class="k">Rent roll</div><div class="v">' + money(cur, r2(roll)) + '</div><div class="s">a month · ' + occ + '% let</div></div>' +
        '<div class="htile' + (r.pending.length ? ' hot' : '') + '" data-go="#tab/approve"><div class="k">Specials to approve</div><div class="v">' + r.pending.length + '</div><div class="s">' + r.running.length + ' on the door</div></div>' +
        '<div class="htile' + (past ? ' hot' : '') + '" data-go="#tab/leases"><div class="k">Leases</div><div class="v">' + ending + ' ending</div><div class="s">' + past + ' past their end</div></div>' +
        '<div class="htile' + (fUrg ? ' hot' : '') + '" data-go="#tab/maint"><div class="k">Maintenance</div><div class="v">' + fOpen.length + ' open</div><div class="s">' + (fUrg ? '⚠ ' + fUrg + ' urgent' : 'nothing urgent') + '</div></div>' +
        '<div class="htile wide2" data-go="#tab/billing"><div class="k">Billing · ' + monthName(thisMonth) + '</div><div class="v">' + bill + '</div><div class="s">Tap to make, check and send the month\'s invoices</div></div>' +
      '</div>' +
      '<div class="h3">Shops</div><div class="hint" style="margin-top:0">Tap a shop to open its own page.</div>' +
      wideT(['Shop', 'Tenant', 'Rentable', 'Rent now', 'Balance', ''], D.units.map(function(u){
        var l = T.leaseOf[u.id], L = l ? balOf[l.id] : null, c = l && !u.vacant ? leaseCalc(l, u, today) : null;
        return { go: '#unit/' + u.id + '/' + (u.vacant || !l ? 'lease' : 'overview'),
                 cells: ['<div class="nmc">' + logoBox(logoOf[u.id] || u, 32) + esc(u.name) + '</div>', u.vacant || !l ? '<span class="hint">Empty</span>' : esc(l.tenant_name),
                         m2s(u.area_m2), c ? money(cur, c.rent) : '', L ? money(cur, L.balance) : '', L ? balPill(L) : '<span class="st empty">Empty</span>'], right: [2, 3, 4] };
      })) + '<div class="narrow-only">' +
      D.units.map(function(u){
        var l = T.leaseOf[u.id], L = l ? balOf[l.id] : null, ou = logoOf[u.id] || u;
        return '<div class="shoprow" data-go="#unit/' + u.id + '/' + (u.vacant || !l ? 'lease' : 'overview') + '">' + logoBox(ou, 44) +
          '<div style="min-width:0"><div class="nm">' + esc(u.name) + '</div><div class="mt">' + (u.vacant || !l ? 'Empty · ' + m2s(u.area_m2) : esc(l.tenant_name)) + '</div></div>' +
          '<div style="margin-left:auto;text-align:right">' + (L ? '<div class="amt">' + money(cur, L.balance) + '</div>' + balPill(L) : '<span class="st empty">Empty</span>') + '</div></div>';
      }).join('') + '</div>' +
      '<div class="b wide" id="out">Log out</div>';
    $('out').onclick = function(){ setSess(null); go('#'); };
  });
}

// ---------- a page per shop ----------
var UF_SECS = [['overview','Overview'],['lease','Lease & spaces'],['charges','Charges'],['invoices','Invoices'],['statement','Statement'],['maint','Maintenance'],['shop','Shop details']];
function pageUnit(id, sec, note){
  var s = sess();
  if (!s || s.role !== 'owner') { go('#login/owner'); return; }
  APP.innerHTML = mini('Shop', '#tab/' + LAST_TAB) + '<div class="loading">Loading…</div>';
  var m0 = monthStart(new Date(Date.now() + 2 * 3600e3).toISOString().slice(0, 10)), m1 = addMonths(m0, 1);
  Promise.all([rpc('ctr_owner_home', { p_centre: CID, p_code: s.code }), mgmtLoad(s), rpc('ctr_statements_home', { p_centre: CID, p_code: s.code }),
               rpc('ctr_billing_home', { p_centre: CID, p_code: s.code, p_period: m0 }), rpc('ctr_billing_home', { p_centre: CID, p_code: s.code, p_period: m1 }),
               rpc('ctr_faults_home', { p_centre: CID, p_code: s.code })]).then(function(all){
    var r = all[0], D = all[1], S = all[2], B0 = all[3], B1 = all[4], FH = all[5];
    var myFaults = FH && FH.ok ? FH.faults.filter(function(f){ return f.unit_id === id && f.status !== 'fixed'; }) : [];
    // this shop's current invoices: this month's and next month's, draft or sent
    var cur2 = [B0, B1].filter(function(B){ return B && B.ok; }).map(function(B){
      return { B: B, inv: (B.invoices || []).filter(function(i){ return i.unit_id === id && i.status !== 'void'; })[0] || null };
    });
    var thisM = cur2[0] || null;
    if (!r.ok || !D.ok || !S.ok) { APP.innerHTML = mini('Shop', '#tab/' + LAST_TAB) + '<div class="pad"><div class="msg err">' + esc((r.ok ? (D.ok ? S : D) : r).msg) + '</div></div>'; return; }
    var T = mgmtTotals(D), u = D.units.filter(function(x){ return x.id === id; })[0];
    if (!u) { APP.innerHTML = mini('Shop', '#tab/' + LAST_TAB) + '<div class="pad empty">This unit is not in the centre any more.</div>'; return; }
    var ou = r.units.filter(function(x){ return x.id === id; })[0], l = T.leaseOf[id], vac = u.vacant || !l;
    var cur = D.centre.currency, today = D.today, lh = S.letterhead;
    var sl = l ? S.leases.filter(function(x){ return x.id === l.id; })[0] : null;
    var invs = l ? S.invoices.filter(function(i){ return i.lease_id === l.id; }) : [], pays = l ? S.payments.filter(function(p){ return p.lease_id === l.id; }) : [];
    var L = l ? ledger(invs, pays, today) : null, c = l ? leaseCalc(l, u, today) : null;
    var secs = UF_SECS.filter(function(x){ return !(vac && (x[0] === 'shop' || x[0] === 'invoices' || x[0] === 'statement' || x[0] === 'overview' || x[0] === 'maint')); });
    if (!secs.some(function(x){ return x[0] === sec; })) sec = secs[0][0];
    APP.innerHTML = mini(u.name, '#tab/' + LAST_TAB) +
      '<div class="ufhero">' + logoBox(ou || u, 64) + '<div style="min-width:0"><div class="ufn">' + esc(u.name) + '</div>' +
        '<div class="ufm">' + (vac ? 'Empty unit · ' + m2s(u.area_m2) : esc(l.tenant_name)) + '</div>' +
        '<div class="ufp">' + (L ? '<span class="ufbal">' + money(cur, L.balance) + '</span> ' + balPill(L) + ' ' : '') + (c ? leasePill(c, l) : '') + '</div></div></div>' +
      '<div class="tabs uftabs">' + secs.map(function(x){ return '<div class="tab' + (x[0] === sec ? ' on' : '') + '" data-go="#unit/' + id + '/' + x[0] + '">' + x[1] + '</div>'; }).join('') + '</div>' +
      '<div class="pad" id="uf">' + (note ? '<div class="msg ok" style="margin-bottom:10px">' + esc(note) + '</div>' : '') + '</div>';
    var box = $('uf'), done = function(msg){ pageUnit(id, sec, msg); };
    function add(html){ box.insertAdjacentHTML('beforeend', html); }

    if (sec === 'overview') {
      var info = function(k, v){ return v ? '<b>' + k + '</b><span>' + v + '</span>' : ''; };
      add('<div class="tiles">' +
          '<div class="tile"><div class="k">' + (L.balance < 0 ? 'In credit' : 'Balance') + '</div><div class="v">' + money(cur, Math.abs(L.balance)) + '</div><div class="s">' + (L.age.d30 + L.age.d60 + L.age.d90 > 0 ? money(cur, r2(L.age.d30 + L.age.d60 + L.age.d90)) + ' is 30+ days' : 'nothing overdue') + '</div></div>' +
          '<div class="tile"><div class="k">Rent now</div><div class="v">' + money(cur, c.rent) + '</div><div class="s">a month, excl. VAT' + (+u.area_m2 ? ' · ' + money(cur, r2(c.rent / +u.area_m2)) + ' per m²' : '') + '</div></div>' +
          '<div class="tile"><div class="k">Lease ends</div><div class="v" style="font-size:16px">' + (l.end_on ? niceY(l.end_on) : 'No end date') + '</div><div class="s">' + (c.toEnd != null ? (c.toEnd < 0 ? 'ended ' + (-c.toEnd) + ' days ago' : 'in ' + c.toEnd + ' days') : '') + '</div></div>' +
          '<div class="tile"><div class="k">Rentable</div><div class="v">' + m2s(u.area_m2) + '</div><div class="s">' + esc(spacesText(u)) + '</div></div>' +
          '<div class="tile" data-go="#unit/' + id + '/invoices" style="cursor:pointer"><div class="k">' + (thisM ? monthName(thisM.B.period) + ' invoice' : 'This month') + '</div>' +
            (thisM && thisM.inv ? '<div class="v">' + money(cur, +thisM.inv.total) + '</div><div class="s">' + (thisM.inv.status === 'sent' ? 'sent · ' + esc(thisM.inv.number) : 'draft, not sent yet') + '</div>'
                                : '<div class="v" style="font-size:16px">Not made yet</div><div class="s">made for all shops on Billing</div>') + '</div>' +
          '<div class="tile' + (myFaults.some(function(f){ return f.urgency === 'urgent'; }) ? ' hot' : '') + '" data-go="#unit/' + id + '/maint" style="cursor:pointer"><div class="k">Maintenance</div><div class="v">' + myFaults.length + ' open</div><div class="s">' +
            (myFaults.length ? esc(myFaults[0].title) : 'nothing reported') + '</div></div></div>' +
        '<div class="ovgrid"><div><div class="h3">Tenant</div><div class="box"><div class="info">' +
          info('Company', esc(l.tenant_name)) + info('Contact', esc(l.contact || '')) +
          info('Phone', l.phone ? '<a href="tel:' + esc(l.phone.replace(/\s/g, '')) + '">' + esc(l.phone) + '</a>' : '') +
          info('Email', l.email ? '<a href="mailto:' + esc(l.email) + '">' + esc(l.email) + '</a>' : '') + info('VAT no.', esc(l.vat_no || '')) + '</div></div>' +
        '</div><div><div class="h3">Lease</div><div class="box"><div class="info">' +
          info('Runs', niceY(l.start_on) + ' to ' + (l.end_on ? niceY(l.end_on) : 'no end date')) +
          info('Rent', l.rent_basis === 'spaces' ? 'from the spaces' : l.rent_basis === 'm2' ? money(cur, +l.rent_value) + ' per m² at the start' : money(cur, +l.rent_value) + ' a month at the start') +
          info('Increase', (+l.increase_pct) + '% a year' + (c.next ? ' · next ' + niceY(c.next) + ' to ' + money(cur, c.nextRent) : '')) +
          info('Deposit', money(cur, +l.deposit) + (l.deposit_kind ? ' · ' + esc(l.deposit_kind) : '')) + '</div></div>' +
        '</div><div><div class="h3">Money</div><div class="box"><div class="info">' +
          info('Last invoice', invs.length ? esc(invs[invs.length - 1].number) + ' · ' + monthName(invs[invs.length - 1].period) + ' · ' + money(cur, +invs[invs.length - 1].total) : 'none yet') +
          info('Last payment', pays.length ? niceY(pays[pays.length - 1].paid_on) + ' · ' + money(cur, +pays[pays.length - 1].amount) : 'none yet') +
          info('By age', 'current ' + money(cur, L.age.cur) + ' · 30d ' + money(cur, L.age.d30) + ' · 60d ' + money(cur, L.age.d60) + ' · 90d+ ' + money(cur, L.age.d90)) + '</div>' +
          '<div class="btns"><div class="b sm main" data-go="#unit/' + id + '/statement">Statement & payments</div><div class="b sm" data-go="#unit/' + id + '/invoices">Invoices</div></div></div></div></div>');
    }
    else if (sec === 'lease' || sec === 'charges') {
      add('<div data-wrap>' + unitCard(D, u, l, T, sec) + '</div>');
      wireUnitCard(D, box.querySelector('[data-wrap]'), s, T, u, done);
    }
    else if (sec === 'invoices') {
      var curHtml = cur2.map(function(x){
        var B = x.B, i = x.inv, st = i && i.status === 'draft' ? staleList(D, lh, B).filter(function(n){ return n === u.name; }).length : 0;
        if (!i) return B.period === m0 ? '<div class="box" style="margin-bottom:10px"><b>' + monthName(B.period) + '</b>: not made yet. Invoices are made for all shops at once.' +
                   '<div class="btns"><div class="b sm main" data-gobill="' + B.period + '">Go to Billing</div></div></div>' : '';
        return '<div class="item curinv" data-cur="' + i.id + '"><div style="display:flex;justify-content:space-between;gap:8px"><div><div class="ti">' + monthName(B.period) + (i.number ? ' · ' + esc(i.number) : '') + '</div>' +
            '<div class="mt">' + (i.status === 'sent' ? 'Sent ' + (i.inv_date ? niceY(i.inv_date) : '') : 'Draft · not sent yet') + '</div></div><div style="text-align:right"><div class="amt">' + money(cur, +i.total) + '</div>' +
            (i.status === 'sent' ? '<span class="st approved">Sent</span>' : '<span class="st pending">Draft</span>') + (st ? ' <span class="st rejected">Out of date</span>' : '') + '</div></div>' +
          (st ? '<div class="ask" style="margin-top:8px">The lease, spaces or charges changed after this draft was made.<div class="btns"><div class="b sm main" data-upd="' + B.period + '">Update the drafts</div></div></div>' : '') +
          '<div class="ivlines">' + i.lines.map(function(l){ return '<div class="crow"><div class="hd"><span style="font-size:13px">' + descHtml(l.description) + '</span><b style="white-space:nowrap">' + money(cur, +l.amount) + '</b></div></div>'; }).join('') +
          '<div class="crow"><div class="hd"><span>VAT</span><b>' + money(cur, +i.vat) + '</b></div></div><div class="crow"><div class="hd"><b>Total</b><b>' + money(cur, +i.total) + '</b></div></div></div>' +
          '<div class="btns">' + (i.status === 'draft' ? '<div class="b sm" data-cpdf>Draft PDF</div><div class="b sm" data-gobill="' + B.period + '">Send from Billing ›</div>' : '<div class="b sm" data-cpdf>Download PDF</div>') + '</div><div class="msg" data-cm></div></div>';
      }).join('');
      add('<div class="h3" style="margin-top:0">Current</div>' + curHtml + '<div class="h3">All sent invoices</div><div class="hint" style="margin-top:0">Newest first.</div>' +
        (invs.length ? invs.slice().reverse().map(function(i){
          return '<div class="item" data-iv="' + i.id + '"><div style="display:flex;justify-content:space-between;gap:8px"><div><div class="ti">' + esc(i.number) + ' · ' + monthName(i.period) + '</div>' +
            '<div class="mt">' + (i.inv_date ? niceY(i.inv_date) : '') + '</div></div><div style="text-align:right"><div class="amt">' + money(cur, +i.total) + '</div>' +
            (i.status === 'void' ? '<span class="st rejected">Cancelled</span>' : '<span class="st approved">Sent</span>') + '</div></div>' +
            '<div class="ivlines">' + i.lines.map(function(x){ return '<div class="crow"><div class="hd"><span style="font-size:13px">' + descHtml(x.description) + '</span><b style="white-space:nowrap">' + money(cur, +x.amount) + '</b></div></div>'; }).join('') +
            '<div class="crow"><div class="hd"><span>VAT</span><b>' + money(cur, +i.vat) + '</b></div></div></div>' +
            '<div class="btns">' + sendBtns('data-ipdf') +
            (i.status === 'sent' ? '<div class="b sm no" data-ivoid>Cancel invoice</div>' : '') + '</div><div class="slot"></div><div class="msg" data-im></div></div>';
        }).join('') : '<div class="box empty">No invoices sent to this tenant yet.</div>'));
      box.querySelectorAll('[data-gobill]').forEach(function(b){ b.onclick = function(){ BILL_PERIOD = b.getAttribute('data-gobill'); BILL_OPEN = null; go('#tab/billing'); }; });
      box.querySelectorAll('[data-upd]').forEach(function(b){ b.onclick = function(){
        var B = cur2.filter(function(x){ return x.B.period === b.getAttribute('data-upd'); })[0].B;
        b.textContent = 'Updating…';
        remakeDrafts(D, lh, B, s).then(function(x){ if (x.ok) done('Drafts updated with the latest lease, spaces and charges.'); else b.textContent = x.msg; });
      }; });
      box.querySelectorAll('[data-cur]').forEach(function(card){
        var cid2 = Number(card.getAttribute('data-cur')), inv = cur2.map(function(x){ return x.inv; }).filter(function(i){ return i && i.id === cid2; })[0], cm = card.querySelector('[data-cm]');
        card.querySelector('[data-cpdf]').onclick = function(){ withPdf(cm, function(){ return pdfOut(buildInvoicePdf(inv, lh), invoiceFileName(inv, lh), 'Invoice', 'save', cm); }); };
      });
      box.querySelectorAll('[data-iv]').forEach(function(card){
        var inv = invs.filter(function(i){ return i.id === Number(card.getAttribute('data-iv')); })[0], im = card.querySelector('[data-im]');
        card.querySelectorAll('[data-ipdf]').forEach(function(b){ b.onclick = function(){
          withPdf(im, function(){ return pdfOut(buildInvoicePdf(inv, lh), invoiceFileName(inv, lh), (lh.vat_registered ? 'Tax invoice ' : 'Invoice ') + inv.number, b.getAttribute('data-ipdf'), im,
            { phone: l.phone, email: l.email, cur: lh.currency, text: invMsg(inv, lh, l.contact) }); });
        }; });
        var vd = card.querySelector('[data-ivoid]');
        if (vd) vd.onclick = function(){
          var slot = card.querySelector('.slot');
          slot.innerHTML = '<div class="ask">Cancel invoice ' + esc(inv.number) + '? It stays on record as cancelled and comes off the statement.' +

var F_STATUS = { reported: 'Reported', assigned: 'Assigned', in_progress: 'Being fixed', fixed: 'Fixed' };

function fStatusPill(st){ return '<span class="st ' + (st === 'fixed' ? 'approved' : st === 'reported' ? 'rejected' : 'pending') + '">' + F_STATUS[st] + '</span>'; }
function fUrgPill(u){ return u === 'urgent' ? '<span class="st rejected">⚠ Urgent</span>' : u === 'low' ? '<span class="st ended">Can wait</span>' : ''; }
function ago(ts){ var d = Math.floor((Date.now() - Date.parse(ts)) / 864e5); return d <= 0 ? 'today' : d === 1 ? 'yesterday' : d + ' days ago'; }
// a photo from the phone → at most 1024 px wide/high JPEG (about 100–250 KB)
function fileToPhoto(file){
  return new Promise(function(ok, no){
    if (!file) return ok(null);
    if (!/^image\//.test(file.type)) return no('Choose a photo (JPG or PNG).');
    var fr = new FileReader();
    fr.onerror = function(){ no('That photo could not be read.'); };
    fr.onload = function(){
      var im = new Image();
      im.onerror = function(){ no('That photo could not be read.'); };
      im.onload = function(){
        var k = Math.min(1, 1024 / Math.max(im.width, im.height)), cv = document.createElement('canvas');
        cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
        var g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(im, 0, 0, cv.width, cv.height);
        var q = 0.72, d = cv.toDataURL('image/jpeg', q);
        while (d.length > 580000 && q > 0.35) { q -= 0.1; d = cv.toDataURL('image/jpeg', q); }
        ok(d);
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

      '<div class="tiles"><div class="tile"><div class="k">Rent roll</div><div class="v">' + money(cur, r2(roll)) + '</div><div class="s">a month, excl. VAT · ' + perM2(roll, T.let_) + '</div></div>' +
      '<div class="tile"><div class="k">Let</div><div class="v">' + occ + '%</div><div class="s">' + m2s(T.let_) + ' of ' + m2s(T.all) + '</div></div>' +
      '<div class="tile"><div class="k">Owed</div><div class="v">' + money(cur, r2(owed)) + '</div><div class="s">by all tenants</div></div>' +
      '<div class="tile"><div class="k">Units</div><div class="v">' + D.units.length + '</div><div class="s">' + rows.filter(function(x){ return !x.c; }).length + ' empty</div></div></div>' +
      '<div class="hint" style="margin:12px 0 6px">Tap a shop to open its page: lease, rent, charges, invoices, statement, maintenance and its details are all there.</div>' +
      '<input id="shQ" placeholder="Find a shop: type the first letters" autocomplete="off" value="' + esc(SHOPS_Q) + '">' +
      wideT(['Shop', 'Tenant', 'Rentable', 'Rent a month', 'Per m²', 'Lease', 'Balance', ''], rows.map(function(x){
        return { go: '#unit/' + x.u.id + '/' + (x.c ? 'overview' : 'lease'), cells: [
          '<div class="nmc" data-sname="' + esc(x.u.name) + '">' + logoBox(logoOf[x.u.id] || x.u, 32) + esc(x.u.name) + (x.f ? ' <span class="st rejected">🔧 ' + x.f + '</span>' : '') + '</div>',
          x.c ? esc(x.l.tenant_name) : '<span class="hint">Empty</span>', m2s(x.u.area_m2), x.c ? money(cur, x.c.rent) : '', x.c ? perM2(x.c.rent, +x.u.area_m2).replace(' per m²', '') : '',
          x.c ? leasePill(x.c, x.l) : '<span class="st empty">Empty</span>', x.L ? money(cur, x.L.balance) : '', x.L ? balPill(x.L) : ''], right: [2, 3, 4, 6] };
      })) + '<div class="narrow-only">' +
      rows.map(function(x){
        return '<div class="shoprow" data-sname="' + esc(x.u.name) + '" data-go="#unit/' + x.u.id + '/' + (x.c ? 'overview' : 'lease') + '">' + logoBox(logoOf[x.u.id] || x.u, 44) +
          '<div style="min-width:0"><div class="nm">' + esc(x.u.name) + (x.f ? ' <span class="st rejected">🔧 ' + x.f + '</span>' : '') + '</div>' +
          '<div class="mt">' + (x.c ? esc(x.l.tenant_name) : 'Empty') + ' · ' + m2s(x.u.area_m2) + '</div>' +
          (x.c ? '<div class="mt">' + money(cur, x.c.rent) + ' a month · ' + perM2(x.c.rent, +x.u.area_m2) + '</div>' : '') + '</div>' +
          '<div style="margin-left:auto;text-align:right">' + (x.L ? '<div class="amt">' + money(cur, x.L.balance) + '</div>' + balPill(x.L) : x.c ? leasePill(x.c, x.l) : '<span class="st empty">Empty</span>') + '</div></div>';
      }).join('') + '</div>' +
      '<div class="btns" style="margin-top:14px"><div class="b" id="addUnit">Add a unit</div><div class="b" id="csv">Export the rent roll to Excel</div></div><div id="addUnitSlot"></div>' +
      '<div class="b wide" id="out">Log out</div>';
    function filt(){ var q = $('shQ').value; SHOPS_Q = q;
      box.querySelectorAll('.shoprow[data-sname]').forEach(function(el){ el.style.display = startsIn(el.getAttribute('data-sname'), q) ? '' : 'none'; });
      box.querySelectorAll('.dt tbody tr').forEach(function(tr){ var n = tr.querySelector('[data-sname]'); tr.style.display = !n || startsIn(n.getAttribute('data-sname'), q) ? '' : 'none'; }); }
    $('shQ').oninput = filt; filt();
    $('csv').onclick = function(){ rentRollCsv(D, T); };
    $('addUnit').onclick = function(){
      $('addUnitSlot').innerHTML = '<div class="box" style="margin-top:10px"><div style="font-weight:700">Add a unit</div>' +
        '<div class="hint">Add the space first. Then, on its page, save the lease: that puts the shop on the door and gives it a shop code.</div>' +
        '<label>Unit name</label><input id="nuName" maxlength="60" placeholder="e.g. Shop 10">' +
        '<div class="two"><div><label>Where</label><input id="nuLoc" maxlength="40" placeholder="e.g. First floor"></div>' +
        '<div><label>Shop floor (m²)</label><input id="nuArea" inputmode="decimal"></div></div>' +
        '<div class="btns"><div class="b sm main" id="nuSave">Add and open it</div><div class="b sm" id="nuCancel">Cancel</div></div><div class="msg" id="nuMsg"></div></div>';
      $('nuCancel').onclick = function(){ $('addUnitSlot').innerHTML = ''; };
      $('nuSave').onclick = function(){
        var a = toNum($('nuArea').value);
        if (a != null && isNaN(a)) { $('nuMsg').className = 'msg err'; $('nuMsg').textContent = 'The size must be a number.'; return; }
        rpc('ctr_space_save', { p_centre: CID, p_code: s.code, p_unit: null, p_name: $('nuName').value, p_location: $('nuLoc').value, p_area: a }).then(function(x){
          if (!x.ok) { $('nuMsg').className = 'msg err'; $('nuMsg').textContent = x.msg; return; }
          go('#unit/' + x.id + '/lease');
        });
      };
    };
    $('out').onclick = function(){ setSess(null); go('#'); };
  });
}

// Home: the big numbers and what needs attention, each line opening the right shop at the right place
function ownerHome2(box, r, s, top){
  box.innerHTML = '<div class="loading">Loading…</div>';
  var m0 = monthStart(new Date(Date.now() + 2 * 3600e3).toISOString().slice(0, 10));
  Promise.all([mgmtLoad(s), rpc('ctr_statements_home', { p_centre: CID, p_code: s.code }), rpc('ctr_billing_home', { p_centre: CID, p_code: s.code, p_period: m0 }),
               rpc('ctr_faults_home', { p_centre: CID, p_code: s.code })]).then(function(all){
    var D = all[0], S = all[1], B = all[2], F = all[3];
    if (!D.ok) { box.innerHTML = '<div class="msg err">' + esc(D.msg) + '</div>'; return; }
    var cur = D.centre.currency, today = D.today, T = mgmtTotals(D); D_CUR = cur;
    var unitOfLease = {}; D.leases.forEach(function(l){ unitOfLease[l.id] = l.unit_id; });
    var owed = 0, late = 0, att = [];
    (S.ok ? S.leases : []).forEach(function(l){
      var L = ledger(S.invoices.filter(function(i){ return i.lease_id === l.id; }), S.payments.filter(function(p){ return p.lease_id === l.id; }), today);
      owed += Math.max(0, L.balance); var o = r2(L.age.d30 + L.age.d60 + L.age.d90); late += o;
      if (o > 0 && !l.ended_on) att.push({ k: 'red', go: '#unit/' + l.unit_id + '/statement', t: '<b>' + esc(l.unit) + '</b>: ' + money(cur, o) + ' is 30+ days overdue' });
    });
    var fOpen = F && F.ok ? F.faults.filter(function(f){ return f.status !== 'fixed'; }) : [];
    fOpen.forEach(function(f){ if (f.urgency === 'urgent' || f.status === 'reported')
      att.push({ k: f.urgency === 'urgent' ? 'red' : 'amber', go: '#unit/' + f.unit_id + '/maint', t: '<b>' + esc(f.unit) + '</b>: ' + esc(f.title) + (f.urgency === 'urgent' ? ' (urgent)' : '') + (f.status === 'reported' ? ' · not assigned yet' : '') }); });
    var roll = 0, ending = 0, past = 0;
    D.units.forEach(function(u){
      var l = T.leaseOf[u.id];
      if (u.vacant || !l) { att.push({ k: 'grey', go: '#unit/' + u.id + '/lease', t: '<b>' + esc(u.name) + '</b> is empty (' + m2s(u.area_m2) + ')' }); return; }
      var c = leaseCalc(l, u, today); if (c.state !== 'starts') roll += c.rent;
      if (c.state === 'past') { past++; att.push({ k: 'red', go: '#unit/' + u.id + '/lease', t: '<b>' + esc(u.name) + '</b>: lease ended ' + niceY(l.end_on) + ', no new lease yet' }); }
      else if (c.state === 'ending') { ending++; att.push({ k: 'amber', go: '#unit/' + u.id + '/lease', t: '<b>' + esc(u.name) + '</b>: lease ends ' + niceY(l.end_on) + ' (' + c.toEnd + ' days)' }); }
      if (c.toNext != null && c.toNext <= 60 && c.state !== 'past') att.push({ k: 'amber', go: '#unit/' + u.id + '/lease', t: '<b>' + esc(u.name) + '</b>: rent goes up ' + (+l.increase_pct) + '% on ' + niceY(c.next) + ' to ' + money(cur, c.nextRent) });
    });
    var stale = B && B.ok ? staleList(D, B.letterhead, B) : [];
    if (stale.length) att.unshift({ k: 'amber', go: '#tab/billing', t: '<b>' + monthName(m0) + ' drafts out of date</b> (' + stale.map(esc).join(', ') + '): update them on Billing' });
    if (r.pending.length) att.push({ k: 'amber', go: '#tab/approve', t: '<b>' + r.pending.length + ' special' + (r.pending.length > 1 ? 's' : '') + '</b> waiting for your approval' });
    var order = { red: 0, amber: 1, grey: 2 }; att.sort(function(a, b){ return order[a.k] - order[b.k]; });
    var bill = B && B.ok ? (B.run ? (B.run.status === 'sent' ? 'Sent ✓' : 'Drafts made' + (stale.length ? ' · ⚠ out of date' : '')) : 'Not made yet') : '—';
    var occ = T.all ? Math.round(T.let_ / T.all * 100) : 0, fUrg = fOpen.filter(function(f){ return f.urgency === 'urgent'; }).length;
    box.innerHTML = top +
      '<div class="hometiles">' +
        '<div class="htile" data-go="#tab/shops"><div class="k">Owed to the centre</div><div class="v">' + money(cur, r2(owed)) + '</div><div class="s">' + money(cur, r2(late)) + ' is 30+ days</div></div>' +
        '<div class="htile" data-go="#tab/shops"><div class="k">Rent roll</div><div class="v">' + money(cur, r2(roll)) + '</div><div class="s">a month · ' + occ + '% let · ' + perM2(roll, T.let_) + '</div></div>' +
        '<div class="htile' + (fUrg ? ' hot' : '') + '" data-go="#tab/maint"><div class="k">Maintenance</div><div class="v">' + fOpen.length + ' open</div><div class="s">' + (fUrg ? '⚠ ' + fUrg + ' urgent' : 'nothing urgent') + '</div></div>' +
        '<div class="htile' + (r.pending.length ? ' hot' : '') + '" data-go="#tab/approve"><div class="k">Specials</div><div class="v">' + r.pending.length + ' to approve</div><div class="s">' + r.running.length + ' on the door</div></div>' +
        '<div class="htile wide2" data-go="#tab/billing"><div class="k">Billing · ' + monthName(m0) + '</div><div class="v">' + bill + '</div><div class="s">Make, check and send the month\'s invoices for all shops</div></div>' +
      '</div>' +
      '<div class="h3">Needs attention</div><div class="box">' +
        (att.length ? att.map(function(a){ return '<div class="att" data-go="' + a.go + '"><span class="dot ' + a.k + '"></span><span>' + a.t + '</span><span style="margin-left:auto;color:var(--quiet)">›</span></div>'; }).join('')
                    : '<div class="empty">Nothing needs attention. 👍</div>') + '</div>' +
      '<div class="b wide" id="out">Log out</div>';
    $('out').onclick = function(){ setSess(null); go('#'); };
  });
}

// Settings: centre details · charges and rents · invoices
var SET_SUB = 'charges';
function ownerSettings(box, r, s, top){
  box.innerHTML = '<div class="cats" style="margin-bottom:12px">' + [['charges', 'Charges & rents'], ['centre', 'Centre details'], ['invoices', 'Invoices']].map(function(x){
    return '<div class="tab' + (SET_SUB === x[0] ? ' on' : '') + '" data-ss="' + x[0] + '">' + x[1] + '</div>'; }).join('') + '</div><div id="setbox"></div>';
  box.querySelectorAll('[data-ss]').forEach(function(t){ t.onclick = function(){ SET_SUB = t.getAttribute('data-ss'); pageOwner(); }; });
  var sb = $('setbox');
  if (SET_SUB === 'centre') ownerCentre(sb, r, s, top);
  else if (SET_SUB === 'invoices') ownerInvSettings(sb, s, top);
  else ownerCharges(sb, s, top);
}
function ownerInvSettings(box, s, top){
  box.innerHTML = '<div class="loading">Loading…</div>';
  rpc('ctr_billing_home', { p_centre: CID, p_code: s.code, p_period: monthStart(new Date().toISOString().slice(0, 10)) }).then(function(B){
    if (!B.ok) { box.innerHTML = '<div class="msg err">' + esc(B.msg) + '</div>'; return; }
    var lh = B.letterhead;
    box.innerHTML = top + '<div class="box"><div style="font-weight:700">Invoice settings</div><div class="hint">What every invoice and statement shows.</div>' +
      '<label>Company name on invoices</label><input id="bsLegal" maxlength="100" value="' + esc(lh.legal_name || '') + '" placeholder="e.g. Sample Centre Properties (Pty) Ltd">' +
      '<label>Email</label><input id="bsEmail" maxlength="120" value="' + esc(lh.email || '') + '">' +
      '<label>Banking details</label><textarea id="bsBank" maxlength="400">' + esc(lh.bank || '') + '</textarea>' +
      '<label>Payment terms</label><textarea id="bsTerms" maxlength="400">' + esc(lh.terms || '') + '</textarea>' +
      '<div class="two"><div><label>Number starts with</label><input id="bsPrefix" maxlength="10" value="' + esc(lh.inv_prefix || '') + '"></div>' +
      '<div><label>Next number</label><input id="bsNext" inputmode="numeric" value="' + esc(lh.inv_next) + '"></div></div>' +
      '<label class="chk" style="margin-top:12px"><input type="checkbox" id="bsVat"' + (lh.vat_registered ? ' checked' : '') + '> VAT registered (15%): TAX INVOICE</label>' +
      '<div class="hint">The VAT number and currency are under Charges & rents; the address and phone under Centre details.</div>' +
      '<div class="b main wide" id="bsSave">Save invoice settings</div><div class="msg" id="bsMsg"></div></div>';
    $('bsSave').onclick = function(){
      var m = $('bsMsg'); m.className = 'msg'; m.textContent = 'Saving…';
      rpc('ctr_billing_settings_save', { p_centre: CID, p_code: s.code, p: { legal_name: $('bsLegal').value, email: $('bsEmail').value, bank: $('bsBank').value,
          terms: $('bsTerms').value, inv_prefix: $('bsPrefix').value.trim(), inv_next: $('bsNext').value, vat_registered: $('bsVat').checked } }).then(function(x){
        if (!x.ok) { m.className = 'msg err'; m.textContent = x.msg; return; }
        m.className = 'msg ok'; m.textContent = 'Invoice settings saved.';
      });
    };
  });
}

// ---------- router ----------
function route(){
  var h = location.hash.replace(/^#/, '');
  top0();
  if (!CID) { // no ?c= in the link: find the centre first, then carry on
    APP.innerHTML = '<div class="loading">Loading…</div>';
    loadDoor().then(function(d){
      if (d && d.ok) route();
      else APP.innerHTML = '<div class="pad"><div class="msg err">' + esc(d ? d.msg : 'Could not load.') + '</div></div>';
    });
    return;
  }
  bar();
  if (MODE === 'office') {           // Block 2: the centre office only
    document.body.classList.add('office');
    document.title = 'ESM Office';
    if (h === 'login/owner') return officeLogin();
    var mu = h.match(/^unit\/(\d+)(?:\/([a-z]+))?$/);
    if (mu) return pageUnit(Number(mu[1]), mu[2] || 'overview');
    var mt = h.match(/^tab\/([a-z]+)$/);
    OWNER_TAB = mt ? mt[1] : 'home';
    if (OWNER_TAB === 'leases' || OWNER_TAB === 'statements') OWNER_TAB = 'shops';
    if (OWNER_TAB === 'charges' || OWNER_TAB === 'centre') { SET_SUB = OWNER_TAB; OWNER_TAB = 'settings'; }
    return pageOwner();
  }
  if (h === 'login/owner' || h === 'owner') { go('#'); return; }   // Block 1 has no owner login
  if (h === 'login/shop') return pageLogin('shop');
  if (h === 'myshop') return pageMyShop();
  APP.innerHTML = '<div class="loading">Loading…</div>';
  loadDoor().then(function(d){
    if (!d || !d.ok) { APP.innerHTML = '<div class="pad"><div class="msg err">' + esc(d ? d.msg : 'Could not load.') + '</div></div>'; return; }
    bar();
    if (h === 'shops') return pageShops();
    var m = h.match(/^shop\/(\d+)$/);
    if (m) return pageShop(Number(m[1]));
    pageDoor();
  });
}
window.addEventListener('hashchange', route);
route();
})();
</script>
