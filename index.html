<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESM Centre</title>
<style>
:root{
  --ink:#1d2433; --quiet:#667085; --line:#d9dee8; --bg:#f4f6fa; --card:#ffffff;
  --brand:#14325c; --brand2:#1f4a85; --accent:#f2b705; --accentInk:#3a2c00;
  --bracket:#b8c2d4; --good:#1d7a46; --goodBg:#e3f4ea; --warn:#8a5a00; --warnBg:#fff3d1; --bad:#a3241b; --badBg:#fde7e5;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:84px}

/* HEADER */
.band{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:18px 16px 26px}
.band .top{display:flex;align-items:center;gap:12px}
.logo{flex:0 0 52px;height:52px;border-radius:12px;border:2px dashed rgba(255,255,255,.55);
  display:flex;align-items:center;justify-content:center;font-size:11px;text-align:center;line-height:1.1;opacity:.9}
.band h1{margin:0;font-size:22px;line-height:1.15}
.band .sub{margin-top:3px;font-size:13px;opacity:.85}
.pill{display:inline-block;margin-top:14px;background:var(--accent);color:var(--accentInk);
  font-weight:700;font-size:12px;padding:5px 12px;border-radius:999px}
.testpill{display:inline-block;margin-left:6px;background:#fff;color:var(--bad);font-weight:700;font-size:11px;padding:4px 9px;border-radius:999px}

/* SMALL HEADER (inner pages) */
.mini{background:var(--brand);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.mini .back{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:10px;padding:7px 12px;font-weight:600;cursor:pointer;white-space:nowrap;flex:0 0 auto}
.mini .t{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* TWO SQUARES */
.squares{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px;margin-top:-14px;position:relative}
.sq{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 12px;text-align:center;
  box-shadow:0 2px 8px rgba(20,50,92,.08);cursor:pointer}
.sq .ic{font-size:26px}
.sq b{display:block;margin-top:6px;font-size:15px}
.sq span{display:block;font-size:12px;color:var(--quiet);margin-top:2px}

/* SECTIONS */
.sec{padding:0 16px;margin-top:22px}
.sec h2{font-size:16px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.sec h2 .n{background:var(--brand);color:#fff;font-size:11px;width:22px;height:22px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center}
.bracket{border:2px dashed var(--bracket);border-radius:14px;padding:14px;background:rgba(255,255,255,.55)}
.bracket .what{font-size:13px;color:var(--quiet);margin:0 0 10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.ph{flex:0 0 132px;height:96px;border-radius:10px;background:repeating-linear-gradient(45deg,#e8ecf3,#e8ecf3 8px,#f1f4f9 8px,#f1f4f9 16px);
  border:1px solid var(--line);display:flex;align-items:flex-end;padding:8px;font-size:11px;color:var(--quiet)}
.fuel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fuel div{background:#eef1f6;border:1px solid var(--line);border-radius:8px;padding:10px 6px;text-align:center;font-size:11px;color:var(--quiet)}
.fuel b{display:block;font-size:16px;color:var(--ink);margin-top:2px}
.li{height:38px;border-radius:8px;background:#eef1f6;border:1px solid var(--line);margin-top:8px;
  display:flex;align-items:center;padding:0 12px;font-size:12px;color:var(--quiet)}

/* SPECIAL CARDS */
.sp{flex:0 0 200px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;
  display:flex;flex-direction:column;gap:4px}
.sp .shop{font-size:11px;color:var(--quiet);text-transform:uppercase;letter-spacing:.04em}
.sp .ti{font-weight:700;font-size:15px;line-height:1.2}
.sp .de{font-size:12px;color:var(--quiet);line-height:1.3}
.sp .bt{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:6px}
.price{background:var(--accent);color:var(--accentInk);font-weight:800;font-size:13px;padding:3px 9px;border-radius:999px}
.until{font-size:11px;color:var(--quiet)}

/* SHOP LIST */
.shoprow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:11px 12px;margin-top:8px;cursor:pointer}
.shoprow:first-child{margin-top:0}
.av{flex:0 0 38px;height:38px;border-radius:10px;background:#e7edf7;color:var(--brand);font-weight:800;
  display:flex;align-items:center;justify-content:center;font-size:14px}
.shoprow .nm{font-weight:600;font-size:15px}
.shoprow .mt{font-size:12px;color:var(--quiet);margin-top:1px}
.shoprow .go{margin-left:auto;color:var(--quiet);font-size:18px}
.tag{font-size:11px;font-weight:700;background:var(--goodBg);color:var(--good);padding:2px 7px;border-radius:999px;margin-left:6px}

/* FORMS + BUTTONS */
.pad{padding:16px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
label:first-child{margin-top:0}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;font-size:16px}
textarea{min-height:70px;resize:vertical}
.hint{font-size:12px;color:var(--quiet);margin-top:4px}
.b{display:inline-block;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;
  font-weight:600;font-size:14px;cursor:pointer;text-align:center}
.b.main{background:var(--brand);border-color:var(--brand);color:#fff}
.b.ok{background:var(--good);border-color:var(--good);color:#fff}
.b.no{color:var(--bad);border-color:#efc4bf}
.b.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.b.wide{display:block;width:100%;margin-top:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.msg{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:14px}
.msg.ok{background:var(--goodBg);color:var(--good)}
.msg.err{background:var(--badBg);color:var(--bad)}
.msg:empty{display:none}
.ask{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--warnBg);color:var(--warn);font-size:14px}
.st{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.st.pending{background:var(--warnBg);color:var(--warn)}
.st.approved{background:var(--goodBg);color:var(--good)}
.st.rejected{background:var(--badBg);color:var(--bad)}
.st.ended{background:#eceff4;color:var(--quiet)}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.item .ti{font-weight:700}
.item .mt{font-size:12px;color:var(--quiet);margin-top:3px}
.item .de{font-size:13px;margin-top:5px}
.code{font-family:ui-monospace,Consolas,monospace;font-weight:700;letter-spacing:.08em;background:#eef1f6;padding:2px 7px;border-radius:6px}
.tabs{display:flex;gap:6px;padding:12px 16px 0;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer}
.tab.on{background:var(--brand);border-color:var(--brand);color:#fff}
.cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:999px;background:var(--accent);color:var(--accentInk);font-size:11px;text-align:center}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:10px}
.cats::-webkit-scrollbar{display:none}
/* e2: leases and charges */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.tile .k{font-size:11px;color:var(--quiet);text-transform:uppercase;letter-spacing:.04em}
.tile .v{font-size:18px;font-weight:800;margin-top:3px}
.tile .s{font-size:12px;color:var(--quiet);margin-top:1px}
.att{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.att:first-child{border-top:0}
.dot{flex:0 0 8px;height:8px;border-radius:50%;margin-top:6px}
.dot.red{background:var(--bad)} .dot.amber{background:#d99a00} .dot.grey{background:#98a2b3}
.rr{cursor:pointer}
.rr .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.rr .amt{font-weight:800;white-space:nowrap}
.st.empty{background:#eceff4;color:var(--quiet)}
.sub{font-size:13px;font-weight:700;color:var(--brand);margin:16px 0 2px;text-transform:uppercase;letter-spacing:.04em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two label{margin-top:12px}
.two > div{min-width:0}
.two input,.two select{min-width:0;max-width:100%}
input[type=date]{-webkit-appearance:none;appearance:none;min-height:44px}
.crow{border-top:1px solid var(--line);padding:10px 0}
.crow:first-of-type{border-top:0}
.crow .hd{display:flex;align-items:center;gap:10px;justify-content:space-between}
.crow .nm{font-weight:700;font-size:14px}
.crow .est{font-size:12px;color:var(--quiet);margin-top:4px}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;margin:0;white-space:nowrap}
.chk input{width:20px;height:20px;accent-color:var(--brand)}
.crow select,.crow input[type=text]{margin-top:6px;font-size:15px;padding:8px 10px}
.empty{font-size:14px;color:var(--quiet);padding:6px 2px}
.info{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.info b{color:var(--quiet);font-weight:600}
.h3{font-size:15px;font-weight:700;margin:20px 0 4px}

/* BOTTOM BAR */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .in{max-width:488px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 8px;text-align:center;
  font-weight:600;font-size:14px;color:var(--ink);cursor:pointer}
.btn.main{background:var(--brand);border-color:var(--brand);color:#fff}
.foot{text-align:center;font-size:11px;color:var(--quiet);margin:26px 0 8px}
.loading{padding:60px 16px;text-align:center;color:var(--quiet)}
</style>
</head>
<body>
<div class="app" id="app"><div class="loading">Loading…</div></div>
<nav class="bar"><div class="in" id="bar"></div></nav>

<script>
(function(){
'use strict';
var ESM_BUILD = 'ESM e2';
var SB_URL = 'https://pqduivcxwykcixqsfrwi.supabase.co';
var SB_KEY = 'sb_publishable_Cl8uDRrLqx9VMaC3lifpWA_Wl91vVy2';   // OTR-Tennis public (publishable) key
var CATS = ['Food','Fashion','Health','Services','Fuel & car','Other'];

var qs = new URLSearchParams(location.search);
var CID = qs.get('c') ? Number(qs.get('c')) : null;
var DOOR = null;          // last door data
var APP = document.getElementById('app');
var BAR = document.getElementById('bar');

// ---------- helpers ----------
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function ymd(s){ var p = String(s).slice(0,10).split('-'); return new Date(Date.UTC(+p[0], +p[1]-1, +p[2])); }
function nice(s){ var d = ymd(s); return DAYS[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()]; }
function addDays(s, n){ var d = ymd(s); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10); }
function initials(n){ var w = String(n).trim().split(/\s+/); return ((w[0]||'')[0]||'').toUpperCase() + ((w[1]||'')[0]||'').toUpperCase(); }
function startsIn(name, q){ // first letters only: any word of the name starts with what was typed
  q = q.trim().toLowerCase(); if (!q) return true;
  return String(name).toLowerCase().split(/[\s&·,\-\/]+/).some(function(w){ return w.indexOf(q) === 0; }) ||
         String(name).toLowerCase().indexOf(q) === 0;
}
function $(id){ return document.getElementById(id); }

function rpc(fn, args){
  return fetch(SB_URL + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(args || {})
  }).then(function(r){
    return r.json().catch(function(){ return null; }).then(function(j){
      if (!r.ok) return { ok:false, msg: (j && j.message) ? j.message : 'Could not reach the server.' };
      return j || { ok:false, msg:'Empty answer from the server.' };
    });
  }).catch(function(){ return { ok:false, msg:'No connection. Please check your internet.' }; });
}

// login kept for this browser tab only
function sess(){ try { return JSON.parse(sessionStorage.getItem('esm_' + CID) || 'null'); } catch(e){ return null; } }
function setSess(v){ try { if (v) sessionStorage.setItem('esm_' + CID, JSON.stringify(v)); else sessionStorage.removeItem('esm_' + CID); } catch(e){} }

function go(h){ if (location.hash === h) route(); else location.hash = h; }
function top0(){ window.scrollTo(0,0); }

function mini(title, backTo){
  return '<div class="mini"><button class="back" data-go="' + esc(backTo) + '">‹ Back</button><div class="t">' + esc(title) + '</div></div>';
}

function bar(){
  var s = sess();
  var left = s && s.role === 'shop'
    ? '<div class="btn" data-go="#myshop">My shop</div>'
    : '<div class="btn" data-go="#login/shop">Tenant login</div>';
  var right = s && s.role === 'owner'
    ? '<div class="btn main" data-go="#owner">Owner desk</div>'
    : '<div class="btn main" data-go="#login/owner">Owner login</div>';
  BAR.innerHTML = left + right;
}

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-go]');
  if (t) { e.preventDefault(); go(t.getAttribute('data-go')); }
});

// ---------- door data ----------
function loadDoor(){
  return rpc('ctr_door', { p_centre: CID }).then(function(d){
    if (d && d.ok) { DOOR = d; if (!CID) CID = d.centre.id; }
    return d;
  });
}

function specialCard(s){
  return '<div class="sp" data-go="#shop/' + s.unit_id + '">' +
    '<div class="shop">' + esc(s.unit) + '</div>' +
    '<div class="ti">' + esc(s.title) + '</div>' +
    (s.detail ? '<div class="de">' + esc(s.detail) + '</div>' : '') +
    '<div class="bt">' + (s.price ? '<span class="price">' + esc(s.price) + '</span>' : '<span></span>') +
    '<span class="until">until ' + nice(s.ends_on) + '</span></div></div>';
}

function shopRow(u, nSpecials){
  var meta = [u.category, u.location, u.hours].filter(Boolean).map(esc).join(' · ');
  return '<div class="shoprow" data-go="#shop/' + u.id + '"><div class="av">' + esc(initials(u.name)) + '</div>' +
    '<div><div class="nm">' + esc(u.name) + (nSpecials ? '<span class="tag">' + nSpecials + ' special' + (nSpecials > 1 ? 's' : '') + '</span>' : '') +
    '</div><div class="mt">' + meta + '</div></div><div class="go">›</div></div>';
}

function countBy(list){ var m = {}; list.forEach(function(s){ m[s.unit_id] = (m[s.unit_id] || 0) + 1; }); return m; }

// ---------- pages ----------
function pageDoor(){
  var c = DOOR.centre, sp = DOOR.specials, units = DOOR.units, per = countBy(sp);
  APP.innerHTML =
    '<header class="band"><div class="top"><div class="logo">centre<br>logo</div><div>' +
      '<h1>' + esc(c.name) + '</h1><div class="sub">' + esc(c.tagline || '') + '</div></div></div>' +
      (c.hours ? '<span class="pill">Open: ' + esc(c.hours) + '</span>' : '') +
      (c.is_test ? '<span class="testpill">TEST</span>' : '') +
    '</header>' +
    '<div class="squares">' +
      '<div class="sq" id="sqSpecials"><div class="ic">🏷️</div><b>Today\'s specials</b><span>' + sp.length + ' from the shops</span></div>' +
      '<div class="sq" data-go="#shops"><div class="ic">🛍️</div><b>Find a shop</b><span>' + units.length + ' shops &amp; services</span></div>' +
    '</div>' +
    '<section class="sec" id="secSpecials"><h2><span class="n">1</span>Specials</h2>' +
      (sp.length ? '<div class="row">' + sp.map(specialCard).join('') + '</div>'
                 : '<div class="box empty">No specials right now. Check again soon.</div>') +
    '</section>' +
    '<section class="sec"><h2><span class="n">2</span>Shops &amp; services</h2><div>' +
      (units.length ? units.map(function(u){ return shopRow(u, per[u.id]); }).join('') : '<div class="box empty">No shops yet.</div>') +
    '</div></section>' +
    '<section class="sec"><h2><span class="n">3</span>Service station</h2><div class="bracket">' +
      '<p class="what">To come: today\'s fuel prices, car wash and forecourt specials.</p>' +
      '<div class="fuel"><div>Petrol 93<b>—</b></div><div>Petrol 95<b>—</b></div><div>Diesel<b>—</b></div></div></div></section>' +
    '<section class="sec"><h2><span class="n">4</span>Events &amp; notices</h2><div class="bracket">' +
      '<p class="what">To come: what\'s on at the centre this week.</p><div class="li">event</div><div class="li">event</div></div></section>' +
    '<section class="sec"><h2><span class="n">5</span>Hours &amp; map</h2><div class="box"><div class="info">' +
      (c.hours ? '<b>Hours</b><span>' + esc(c.hours) + '</span>' : '') +
      (c.phone ? '<b>Phone</b><a href="tel:' + esc(c.phone.replace(/\s/g,'')) + '">' + esc(c.phone) + '</a>' : '') +
      (c.address ? '<b>Address</b><span>' + esc(c.address) + '</span>' : '') +
      '</div><div class="row" style="margin-top:12px"><div class="ph" style="flex-basis:100%;height:110px">map — to come</div></div></div></section>' +
    '<div class="foot">' + ESM_BUILD + '</div>';
  $('sqSpecials').onclick = function(){ $('secSpecials').scrollIntoView({ behavior:'smooth' }); };
}

function pageShops(){
  var units = DOOR.units, per = countBy(DOOR.specials), cat = '';
  APP.innerHTML = mini('Find a shop', '#') +
    '<div class="pad"><input id="q" placeholder="Type the first letters of a shop" autocomplete="off">' +
    '<div class="cats" id="cats"></div><div id="list" style="margin-top:12px"></div></div>';
  var used = CATS.filter(function(k){ return units.some(function(u){ return u.category === k; }); });
  function drawCats(){
    $('cats').innerHTML = ['All'].concat(used).map(function(k){
      var on = (k === 'All' ? cat === '' : cat === k);
      return '<div class="tab' + (on ? ' on' : '') + '" data-cat="' + esc(k) + '">' + esc(k) + '</div>'; }).join('');
  }
  function draw(){
    var q = $('q').value;
    var list = units.filter(function(u){ return (!cat || u.category === cat) && startsIn(u.name, q); });
    $('list').innerHTML = list.length ? list.map(function(u){ return shopRow(u, per[u.id]); }).join('') : '<div class="empty">No shop starts with that.</div>';
  }
  $('cats').onclick = function(e){ var t = e.target.closest('[data-cat]'); if (!t) return;
    var k = t.getAttribute('data-cat'); cat = (k === 'All' ? '' : k); drawCats(); draw(); };
  $('q').oninput = draw; drawCats(); draw();
}

function pageShop(id){
  var u = DOOR.units.filter(function(x){ return x.id === id; })[0];
  if (!u) { APP.innerHTML = mini('Shop', '#') + '<div class="pad empty">This shop is not on the door any more.</div>'; return; }
  var sp = DOOR.specials.filter(function(s){ return s.unit_id === id; });
  APP.innerHTML = mini(u.name, '#') +
    '<div class="pad"><div class="box"><div style="display:flex;gap:12px;align-items:center">' +
      '<div class="av" style="flex-basis:48px;height:48px;font-size:17px">' + esc(initials(u.name)) + '</div>' +
      '<div><div style="font-weight:700;font-size:18px">' + esc(u.name) + '</div><div class="hint">' + esc(u.category) + '</div></div></div>' +
      '<div class="info" style="margin-top:14px">' +
        (u.location ? '<b>Where</b><span>' + esc(u.location) + '</span>' : '') +
        (u.hours ? '<b>Hours</b><span>' + esc(u.hours) + '</span>' : '') +
        (u.phone ? '<b>Phone</b><a href="tel:' + esc(u.phone.replace(/\s/g,'')) + '">' + esc(u.phone) + '</a>' : '') +
      '</div></div>' +
      '<div class="h3">Specials</div>' +
      (sp.length ? sp.map(function(s){
        return '<div class="item"><div class="ti">' + esc(s.title) + (s.price ? ' <span class="price">' + esc(s.price) + '</span>' : '') + '</div>' +

  if (s.status !== 'rejected' && s.ends_on < today) return '<span class="st ended">Ended</span>';
  if (s.status === 'pending') return '<span class="st pending">Waiting for approval</span>';
  if (s.status === 'approved') return '<span class="st approved">On the door</span>';
  return '<span class="st rejected">Not approved</span>';
}

// =====================================================================
// e2 · LEASES AND CHARGES (owner only)
// =====================================================================
var MGMT_OPEN = null;      // the unit whose card is open on the Leases tab
var METHODS = { fixed:'Fixed amount', per_m2:'Rate per m²', share:'Share by area', metered:'Metered', off:'Off' };

function money(cur, n){
  if (n == null || isNaN(n)) return '—';
  var neg = n < 0, p = Math.abs(Math.round(n * 100) / 100).toFixed(2).split('.');
  return (neg ? '-' : '') + cur + ' ' + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + '.' + p[1];
}
function niceY(s){ var d = ymd(s); return d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); }
function numStr(n){ return n == null ? '' : String(+n); }
function m2s(n){ return n == null || n === '' ? '— m²' : String(+n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' m²'; }
function daysTo(a, b){ return Math.round((ymd(b) - ymd(a)) / 864e5); }
function addYears(s, n){ var d = ymd(s); d.setUTCFullYear(d.getUTCFullYear() + n); return d.toISOString().slice(0,10); }
function fullYears(a, b){ if (b < a) return 0; var y = +b.slice(0,4) - +a.slice(0,4); if (b.slice(5) < a.slice(5)) y--; return Math.max(0, y); }
function toNum(v){ v = String(v == null ? '' : v).replace(/\s/g, '').replace(',', '.'); return v === '' ? null : Number(v); }

// rent now (after the yearly increases), the next increase, and the lease's state
function leaseCalc(l, u, today){
  var pct = +l.increase_pct || 0;
  var base = l.rent_basis === 'm2' ? (+l.rent_value) * (+u.area_m2 || 0) : +l.rent_value;
  var yrs = l.start_on > today ? 0 : fullYears(l.start_on, today);
  var rent = Math.round(base * Math.pow(1 + pct / 100, yrs) * 100) / 100;
  var next = pct > 0 ? addYears(l.start_on, yrs + 1) : null;
  var c = { rent: rent, next: next, nextRent: Math.round(rent * (1 + pct / 100) * 100) / 100,
            toNext: next ? daysTo(today, next) : null, toEnd: l.end_on ? daysTo(today, l.end_on) : null };
  c.state = l.start_on > today ? 'starts' : (l.end_on && l.end_on < today) ? 'past' : (c.toEnd != null && c.toEnd <= 90) ? 'ending' : 'running';
  return c;
}
function leasePill(c, l){
  if (c.state === 'past') return '<span class="st rejected">Past its end</span>';
  if (c.state === 'ending') return '<span class="st pending">Ends in ' + c.toEnd + ' days</span>';
  if (c.state === 'starts') return '<span class="st ended">Starts ' + niceY(l.start_on) + '</span>';
  return '<span class="st approved">Running</span>';
}

function mgmtTotals(D){
  var leaseOf = {}; D.leases.forEach(function(l){ leaseOf[l.unit_id] = l; });
  var all = 0, let_ = 0;
  D.units.forEach(function(u){ var a = +u.area_m2 || 0; all += a; if (!u.vacant && leaseOf[u.id]) let_ += a; });
  return { leaseOf: leaseOf, all: all, let_: let_, basis: D.centre.share_basis === 'let' ? let_ : all };
}

// what one charge comes to for one shop each month (or how it will be worked out)
function chargeRow(D, u, ct){
  var r = D.unit_charges.filter(function(x){ return x.unit_id === u.id && x.charge_id === ct.id; })[0];
  return r || { enabled: ct.method !== 'off', method: null, amount: null, has_meter: false, meter_no: null, _new: true };
}
function chargeEst(D, u, ct, row, T){
  var cur = D.centre.currency, vat = ct.vat ? ' + VAT' : '';
  if (!row.enabled) return 'Off for this shop';
  var m = row.method || ct.method, area = +u.area_m2 || 0;
  function share(){ return T.basis > 0 && area > 0 ? (Math.round(area / T.basis * 10000) / 100) + '% of the centre\'s bill each month' + vat : 'Share by area: fill in the m² first'; }
  if (m === 'off') return 'Off';
  if (m === 'fixed') return money(cur, row.amount != null ? +row.amount : +ct.rate) + ' a month' + vat;
  if (m === 'per_m2') return area ? m2s(area) + ' × ' + money(cur, +ct.rate) + ' = ' + money(cur, area * ct.rate) + ' a month' + vat : 'Rate per m²: fill in the m² first';
  if (m === 'share') return share();
  if (m === 'metered') return row.has_meter
    ? 'Meter ' + esc(row.meter_no || '') + ': units used × ' + money(cur, +ct.rate) + (+ct.basic ? ' + basic ' + money(cur, +ct.basic) : '') + vat
    : 'No meter, so ' + share();
  return '';
}

function ownerLeases(box, s, top){
  box.innerHTML = '<div class="loading">Loading…</div>';
  rpc('ctr_mgmt_home', { p_centre: CID, p_code: s.code }).then(function(D){
    if (!D.ok) { box.innerHTML = '<div class="msg err">' + esc(D.msg) + '</div>'; return; }
    var cur = D.centre.currency, today = D.today, T = mgmtTotals(D);
    var roll = 0, ending = 0, past = 0, incr = 0, empty = 0, att = [];
    D.units.forEach(function(u){
      var l = T.leaseOf[u.id];
      if (u.vacant || !l) { empty++; att.push({ u: u, dot: 'grey', t: esc(u.name) + ' is empty' + (u.area_m2 ? ' (' + m2s(u.area_m2) + ')' : '') }); return; }
      var c = leaseCalc(l, u, today); if (c.state !== 'starts') roll += c.rent;
      if (c.state === 'past') { past++; att.push({ u: u, dot: 'red', t: esc(u.name) + ': lease ended ' + niceY(l.end_on) + ', still trading (no new lease)' }); }
      else if (c.state === 'ending') { ending++; att.push({ u: u, dot: 'amber', t: esc(u.name) + ': lease ends ' + niceY(l.end_on) + ' (' + c.toEnd + ' days)' }); }
      if (c.toNext != null && c.toNext <= 60 && c.state !== 'past') { incr++; att.push({ u: u, dot: 'amber', t: esc(u.name) + ': rent goes up ' + (+l.increase_pct) + '% on ' + niceY(c.next) + ' to ' + money(cur, c.nextRent) }); }
      if (!u.area_m2) att.push({ u: u, dot: 'grey', t: esc(u.name) + ': m² not filled in' });
    });
    var occ = T.all ? Math.round(T.let_ / T.all * 100) : 0;
    var html = top +
      '<div class="tiles">' +
        '<div class="tile"><div class="k">Rent roll</div><div class="v">' + money(cur, roll) + '</div><div class="s">a month, excl. VAT</div></div>' +
        '<div class="tile"><div class="k">Let</div><div class="v">' + occ + '%</div><div class="s">' + m2s(T.let_) + ' of ' + m2s(T.all) + '</div></div>' +
        '<div class="tile"><div class="k">Ending in 90 days</div><div class="v">' + ending + '</div><div class="s">' + past + ' past their end</div></div>' +
        '<div class="tile"><div class="k">Rent increases</div><div class="v">' + incr + '</div><div class="s">in the next 60 days</div></div>' +
      '</div>' +
      '<div class="h3">Needs attention</div><div class="box">' +
        (att.length ? att.map(function(a){ return '<div class="att" data-open="' + a.u.id + '"><span class="dot ' + a.dot + '"></span><span>' + a.t + '</span></div>'; }).join('')
                    : '<div class="empty">Nothing needs attention.</div>') + '</div>' +
      '<div class="h3">Rent roll · ' + D.units.length + ' units' + (empty ? ' · ' + empty + ' empty' : '') + '</div>' +
      D.units.map(function(u){
        var l = T.leaseOf[u.id], c = l && !u.vacant ? leaseCalc(l, u, today) : null;
        return '<div class="item rr" data-u="' + u.id + '"><div class="top" data-open="' + u.id + '"><div>' +
          '<div class="ti">' + esc(u.name) + '</div>' +
          '<div class="mt">' + (c ? esc(l.tenant_name) : 'Empty') + ' · ' + m2s(u.area_m2) + (u.location ? ' · ' + esc(u.location) : '') + '</div>' +
          (c ? '<div class="mt">' + niceY(l.start_on) + ' to ' + (l.end_on ? niceY(l.end_on) : 'no end date') + '</div>' : '') +
          '</div><div style="text-align:right">' + (c ? '<div class="amt">' + money(cur, c.rent) + '</div>' + leasePill(c, l) : '<span class="st empty">Empty</span>') +
          '</div></div>' + (MGMT_OPEN === u.id ? unitCard(D, u, l, T) : '') + '</div>';
      }).join('') +
      '<div class="btns" style="margin-top:14px"><div class="b" id="addUnit">Add an empty unit</div><div class="b" id="csv">Export to Excel</div></div>' +
      '<div id="addUnitSlot"></div>' +
      '<div class="b wide" id="out">Log out</div>';
    box.innerHTML = html;
    if (MGMT_OPEN) { var open = box.querySelector('[data-u="' + MGMT_OPEN + '"]'); if (open) { wireUnitCard(D, open, s, T); } }
    box.onclick = function(e){
      var t;
      if ((t = e.target.closest('[data-open]'))) {
        var id = Number(t.getAttribute('data-open'));
        MGMT_OPEN = (MGMT_OPEN === id ? null : id); ownerLeases(box, s, top);
        if (MGMT_OPEN) setTimeout(function(){ var el = box.querySelector('[data-u="' + id + '"]'); if (el) el.scrollIntoView({ block: 'start' }); }, 30);
      } else if (e.target.id === 'addUnit') {
        $('addUnitSlot').innerHTML = '<div class="box" style="margin-top:10px"><div style="font-weight:700">Add an empty unit</div>' +
          '<div class="hint">It is not on the door until a lease is added.</div>' +
          '<label>Unit name</label><input id="nuName" maxlength="60" placeholder="e.g. Shop 10">' +
          '<div class="two"><div><label>Where</label><input id="nuLoc" maxlength="40" placeholder="e.g. First floor"></div>' +
          '<div><label>Size (m²)</label><input id="nuArea" inputmode="decimal"></div></div>' +
          '<div class="btns"><div class="b sm main" id="nuSave">Add</div><div class="b sm" id="nuCancel">Cancel</div></div><div class="msg" id="nuMsg"></div></div>';
        $('nuCancel').onclick = function(ev){ ev.stopPropagation(); $('addUnitSlot').innerHTML = ''; };
        $('nuSave').onclick = function(ev){ ev.stopPropagation();
          var a = toNum($('nuArea').value);
          if (a != null && isNaN(a)) { $('nuMsg').className = 'msg err'; $('nuMsg').textContent = 'The size must be a number.'; return; }
          rpc('ctr_space_save', { p_centre: CID, p_code: s.code, p_unit: null, p_name: $('nuName').value, p_location: $('nuLoc').value, p_area: a }).then(function(x){
            if (!x.ok) { $('nuMsg').className = 'msg err'; $('nuMsg').textContent = x.msg; return; }
            MGMT_OPEN = x.id; pageOwner('Empty unit added. Add its lease when a tenant signs.');
          });
        };
      } else if (e.target.id === 'csv') { rentRollCsv(D, T);
      } else if (e.target.id === 'out') { setSess(null); bar(); go('#'); }
    };
  });
}

function wireUnitCard(D, wrap, s, T){
  var card = wrap.querySelector('[data-card]'), u = D.units.filter(function(x){ return x.id === MGMT_OPEN; })[0];
  var l = T.leaseOf[u.id], cur = D.centre.currency;
  card.onclick = function(e){ e.stopPropagation(); };
  function val(sel){ var el = card.querySelector(sel); return el ? el.value : ''; }
  function showCalc(){
    var area = toNum(val('[data-s=area]')), L = { rent_basis: val('[data-l=rent_basis]'), rent_value: toNum(val('[data-l=rent_value]')),
      increase_pct: toNum(val('[data-l=increase_pct]')) || 0, start_on: val('[data-l=start_on]'), end_on: val('[data-l=end_on]') };
    var el = card.querySelector('[data-calc]');
    if (!L.start_on || L.rent_value == null || isNaN(L.rent_value)) { el.textContent = ''; return; }
    var c = leaseCalc(L, { area_m2: area }, D.today);
    el.textContent = 'Rent now: ' + money(cur, c.rent) + ' a month excl. VAT' + (c.next ? ' · next increase ' + niceY(c.next) + ' to ' + money(cur, c.nextRent) : '');
  }
  card.querySelectorAll('[data-l],[data-s]').forEach(function(el){ el.oninput = showCalc; el.onchange = showCalc; });
  showCalc();
  // charges: show the right boxes and the estimate as things change
  function paintRow(row){
    var ct = D.charges.filter(function(c){ return c.id === Number(row.getAttribute('data-ch')); })[0];
    var r = { enabled: row.querySelector('[data-c=enabled]').checked, method: row.querySelector('[data-c=method]').value || null,
              amount: toNum(row.querySelector('[data-c=amount]').value), has_meter: row.querySelector('[data-c=has_meter]').checked,
              meter_no: row.querySelector('[data-c=meter_no]').value };
    var m = r.method || ct.method;
    row.querySelector('[data-c=method]').style.display = r.enabled ? '' : 'none';
    row.querySelector('[data-c=amount]').style.display = r.enabled && m === 'fixed' ? '' : 'none';
    row.querySelector('[data-meterbox]').style.display = r.enabled && m === 'metered' ? '' : 'none';
    row.querySelector('[data-c=meter_no]').style.display = r.enabled && m === 'metered' && r.has_meter ? '' : 'none';
    var uu = { id: u.id, area_m2: toNum(val('[data-s=area]')) };
    row.querySelector('.est').innerHTML = chargeEst(D, uu, ct, r, T);
    return { ct: ct, r: r };
  }
  card.querySelectorAll('.crow').forEach(function(row){
    row.querySelectorAll('[data-c]').forEach(function(el){ el.onchange = function(){ paintRow(row); }; el.oninput = el.onchange; });
    paintRow(row);
  });
  card.querySelector('[data-close]').onclick = function(){ MGMT_OPEN = null; pageOwner(); };
  card.querySelector('[data-save]').onclick = function(){
    var m = card.querySelector('[data-m]'); m.className = 'msg'; m.textContent = 'Saving…';
    var area = toNum(val('[data-s=area]'));
    if (area != null && isNaN(area)) { m.className = 'msg err'; m.textContent = 'The size must be a number.'; return; }
    var L = {}; card.querySelectorAll('[data-l]').forEach(function(el){ L[el.getAttribute('data-l')] = el.value; });
    rpc('ctr_space_save', { p_centre: CID, p_code: s.code, p_unit: u.id, p_name: val('[data-s=name]'), p_location: val('[data-s=location]'), p_area: area }).then(function(x){
      if (!x.ok) { m.className = 'msg err'; m.textContent = x.msg; return; }
      if ((u.vacant || !l) && !L.tenant_name.trim()) { pageOwner('Unit saved.'); return; }
      rpc('ctr_lease_save', { p_centre: CID, p_code: s.code, p_unit: u.id, p_lease: L }).then(function(y){
        if (!y.ok) { m.className = 'msg err'; m.textContent = y.msg; return; }
        pageOwner(y.code ? 'Lease saved. ' + L.shop_name + ' is on the door; its shop code is ' + y.code + '.' : 'Lease saved.');
      });
    });
  };
  var leave = card.querySelector('[data-leave]');
  if (leave) leave.onclick = function(){
    var slot = card.querySelector('.slot');
    slot.innerHTML = '<div class="ask">' + esc(u.name) + ' leaves. The lease is closed, the shop goes off the door and its code stops working.' +
      '<label style="color:inherit">Last day</label><input type="date" data-end value="' + D.today + '">' +
      '<div class="btns"><div class="b sm no" data-y>Yes, close the lease</div><div class="b sm" data-n>No</div></div><div class="msg" data-mm></div></div>';
    slot.querySelector('[data-n]').onclick = function(){ slot.innerHTML = ''; };
    slot.querySelector('[data-y]').onclick = function(){
      rpc('ctr_lease_end', { p_centre: CID, p_code: s.code, p_lease: l.id, p_ended_on: slot.querySelector('[data-end]').value || null }).then(function(x){
        if (!x.ok) { var mm = slot.querySelector('[data-mm]'); mm.className = 'msg err'; mm.textContent = x.msg; return; }
        pageOwner('Lease closed. ' + u.name + ' is now an empty unit.');
      });
    };
  };
  card.querySelector('[data-csave]').onclick = function(){
    var cm = card.querySelector('[data-cm]'), jobs = [];
    var rows = Array.prototype.slice.call(card.querySelectorAll('.crow'));
    for (var i = 0; i < rows.length; i++) {
      var p = paintRow(rows[i]), old = chargeRow(D, u, p.ct), r = p.r;
      if (r.amount != null && isNaN(r.amount)) { cm.className = 'msg err'; cm.textContent = p.ct.name + ': the amount must be a number.'; return; }
      var same = !!old.enabled === r.enabled && (old.method || null) === r.method && (old.amount == null ? null : +old.amount) === r.amount &&
                 !!old.has_meter === r.has_meter && (old.meter_no || '') === r.meter_no;
      if (!same) jobs.push({ p_centre: CID, p_code: s.code, p_unit: u.id, p_charge: p.ct.id, p_enabled: r.enabled, p_method: r.method,
                             p_amount: r.amount, p_has_meter: r.has_meter, p_meter_no: r.meter_no });
    }
    if (!jobs.length) { cm.className = 'msg ok'; cm.textContent = 'Nothing changed.'; return; }
    cm.className = 'msg'; cm.textContent = 'Saving…';
    (function next(i){
      if (i >= jobs.length) { pageOwner('Charges saved for ' + u.name + '.'); return; }
      rpc('ctr_unit_charge_save', jobs[i]).then(function(x){
        if (!x.ok) { cm.className = 'msg err'; cm.textContent = x.msg; return; }
        next(i + 1);
      });
    })(0);
  };
}

function rentRollCsv(D, T){
  var cur = D.centre.currency, today = D.today;
  var q = function(v){ v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  var rows = [['Unit','Where','m2','Tenant','Contact','Phone','Start','End','Rent basis','Rent at start','Rent now (' + cur + ' excl VAT)',
               'Yearly increase %','Next increase','Rent after next increase','Deposit','Deposit held as','State']];
  D.units.forEach(function(u){
    var l = T.leaseOf[u.id];
    if (u.vacant || !l) { rows.push([u.name, u.location, u.area_m2, '', '', '', '', '', '', '', '', '', '', '', '', '', 'Empty']); return; }
    var c = leaseCalc(l, u, today);
    rows.push([u.name, u.location, u.area_m2, l.tenant_name, l.contact, l.phone, l.start_on, l.end_on, l.rent_basis === 'm2' ? 'per m2' : 'per month',
               (+l.rent_value).toFixed(2), c.rent.toFixed(2), +l.increase_pct, c.next || '', c.next ? c.nextRent.toFixed(2) : '', (+l.deposit).toFixed(2), l.deposit_kind,
               { past: 'Past its end', ending: 'Ends in ' + c.toEnd + ' days', starts: 'Not started', running: 'Running' }[c.state]]);
  });
  var csv = '﻿' + rows.map(function(r){ return r.map(q).join(','); }).join('\r\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'Rent roll ' + D.centre.name.replace(/[\\/:*?"<>|]+/g, '-') + ' ' + today + '.csv';
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

function ownerCharges(box, s, top){

      if (ct.method === 'fixed') return money(cur, +ct.rate) + ' a month per shop (default)';
      if (ct.method === 'per_m2') return money(cur, +ct.rate) + ' per m² a month';
      if (ct.method === 'share') return 'each shop pays its share of the centre\'s bill';
      if (ct.method === 'metered') return money(cur, +ct.rate) + ' per unit used' + (+ct.basic ? ' + basic ' + money(cur, +ct.basic) : '') + '; no meter = share by area';

    box.innerHTML = top +
      '<div class="box"><div style="font-weight:700">Settings</div>' +

        '<label>Share by area is worked out on</label><select id="stShare">' +
          '<option value="all"' + (c.share_basis !== 'let' ? ' selected' : '') + '>The whole centre\'s m² (the owner carries the empty units)</option>' +
          '<option value="let"' + (c.share_basis === 'let' ? ' selected' : '') + '>Let m² only (the tenants carry the empty units)</option></select>' +
        '<div class="hint">Whole centre: ' + m2s(T.all) + ' · let: ' + m2s(T.let_) + '. VAT is 15%.</div>' +
        '<div class="b main wide" id="stSave">Save settings</div><div class="msg" id="stMsg"></div></div>' +
      '<div class="h3">The centre\'s charges</div><div class="hint">These are the choices on every shop\'s charges. Rent is on each lease.</div>' +
      D.charges.map(function(ct){
        return '<div class="item" data-ct="' + ct.id + '"><div class="top" style="display:flex;justify-content:space-between;gap:8px">' +
          '<div class="ti">' + esc(ct.name) + '</div><span class="st ' + (ct.method === 'off' ? 'ended' : 'approved') + '">' + esc(METHODS[ct.method]) + '</span></div>' +

          '<div class="btns"><div class="b sm" data-ed="' + ct.id + '">Change</div><div class="b sm no" data-del="' + ct.id + '">Remove</div></div><div class="slot"></div></div>';
      }).join('') +
      '<div class="b main wide" id="ctAdd">Add a charge</div><div id="ctAddSlot"></div>' +
      '<div class="b wide" id="out">Log out</div>';
    $('stSave').onclick = function(){
      var m = $('stMsg'); m.className = 'msg'; m.textContent = 'Saving…';
      rpc('ctr_settings_save', { p_centre: CID, p_code: s.code, p_currency: $('stCur').value, p_share_basis: $('stShare').value, p_vat_no: $('stVat').value }).then(function(x){
        if (!x.ok) { m.className = 'msg err'; m.textContent = x.msg; return; }
        pageOwner('Settings saved.');
      });
    };
    function form(ct){

      return '<div class="box" style="margin-top:10px" data-form="' + (ct.id || '') + '">' +
        '<label>Name</label><input data-f="name" maxlength="40" value="' + esc(ct.name) + '" placeholder="e.g. Air conditioning">' +
        '<label>How it is worked out</label><select data-f="method">' + Object.keys(METHODS).map(function(k){
          return '<option value="' + k + '"' + (ct.method === k ? ' selected' : '') + '>' + esc(METHODS[k]) + '</option>'; }).join('') + '</select>' +
        '<div data-rate><label data-ratelabel></label><input data-f="rate" inputmode="decimal" value="' + esc(numStr(ct.rate)) + '"></div>' +
        '<div data-basic><label>Basic charge a month (' + cur + ')</label><input data-f="basic" inputmode="decimal" value="' + esc(numStr(ct.basic)) + '"></div>' +
        '<div class="hint" data-how></div>' +
        '<label class="chk" style="margin-top:12px"><input type="checkbox" data-f="vat"' + (ct.vat ? ' checked' : '') + '> Add VAT (15%)</label>' +
        '<div class="two"><div><label>Place in the list</label><input data-f="sort" inputmode="numeric" value="' + esc(ct.sort) + '"></div><div></div></div>' +
        '<div class="btns"><div class="b sm main" data-fsave>Save</div><div class="b sm" data-fcancel>Cancel</div></div><div class="msg" data-fm></div></div>';
    }
    function wire(holder){
      var f = holder.querySelector('[data-form]');
      function paint(){
        var m = f.querySelector('[data-f=method]').value;
        f.querySelector('[data-rate]').style.display = (m === 'fixed' || m === 'per_m2' || m === 'metered') ? '' : 'none';
        f.querySelector('[data-basic]').style.display = m === 'metered' ? '' : 'none';
        f.querySelector('[data-ratelabel]').textContent = m === 'fixed' ? 'Default amount per shop a month (' + cur + ')' :
          m === 'per_m2' ? 'Rate per m² a month (' + cur + ')' : 'Tariff per unit used, e.g. per kWh or kl (' + cur + ')';
        f.querySelector('[data-how]').textContent = {
          fixed: 'The same amount each month. A shop can have its own amount.',
          per_m2: 'Each shop pays its m² × this rate.',
          share: 'Each month you enter the centre\'s bill; each shop pays its share by m².',
          metered: 'Shops with a meter pay units used × tariff (+ basic). Shops without a meter pay a share by m².',
          off: 'Not charged.' }[m];
      }
      f.querySelector('[data-f=method]').onchange = paint; paint();
      f.querySelector('[data-fcancel]').onclick = function(ev){ ev.stopPropagation(); holder.innerHTML = ''; };
      f.querySelector('[data-fsave]').onclick = function(ev){ ev.stopPropagation();
        var g = function(k){ return f.querySelector('[data-f=' + k + ']'); }, m = f.querySelector('[data-fm]');
        var rate = toNum(g('rate').value) || 0, basic = toNum(g('basic').value) || 0;
        if (isNaN(rate) || isNaN(basic)) { m.className = 'msg err'; m.textContent = 'Amounts must be numbers.'; return; }
        var id = f.getAttribute('data-form');
        rpc('ctr_charge_save', { p_centre: CID, p_code: s.code, p_id: id ? Number(id) : null, p_name: g('name').value, p_method: g('method').value,
            p_rate: rate, p_basic: basic, p_vat: g('vat').checked, p_sort: parseInt(g('sort').value, 10) || 100 }).then(function(x){
          if (!x.ok) { m.className = 'msg err'; m.textContent = x.msg; return; }
          pageOwner(id ? 'Charge saved.' : 'Charge added. Every shop now has it in its charges.');
        });
      };
    }
    box.onclick = function(e){
      var t;
      if (e.target.id === 'ctAdd') { $('ctAddSlot').innerHTML = form(null); wire($('ctAddSlot')); }
      else if ((t = e.target.closest('[data-ed]'))) {
        var ct = D.charges.filter(function(x){ return x.id === Number(t.getAttribute('data-ed')); })[0], sl = t.closest('.item').querySelector('.slot');
        sl.innerHTML = form(ct); wire(sl);
      } else if ((t = e.target.closest('[data-del]'))) {
        var did = Number(t.getAttribute('data-del')), nm = D.charges.filter(function(x){ return x.id === did; })[0].name;
        askIn(t.closest('.item').querySelector('.slot'), 'Remove ' + nm + ' from the centre\'s charges? No shop will be charged for it.', 'Yes, remove', function(){
          return rpc('ctr_charge_remove', { p_centre: CID, p_code: s.code, p_id: did }).then(function(x){ if (x.ok) pageOwner(nm + ' removed.'); return x; });
        });
      } else if (e.target.id === 'out') { setSess(null); bar(); go('#'); }
    };
  });
}

// ---------- router ----------
function route(){
  var h = location.hash.replace(/^#/, '');
  top0();
  if (!CID) { // no ?c= in the link: find the centre first, then carry on
    APP.innerHTML = '<div class="loading">Loading…</div>';
    loadDoor().then(function(d){
      if (d && d.ok) route();
      else APP.innerHTML = '<div class="pad"><div class="msg err">' + esc(d ? d.msg : 'Could not load.') + '</div></div>';
    });
    return;
  }
  bar();
  if (h === 'login/shop') return pageLogin('shop');
  if (h === 'login/owner') return pageLogin('owner');
  if (h === 'myshop') return pageMyShop();
  if (h === 'owner') { OWNER_TAB = 'approve'; return pageOwner(); }
  APP.innerHTML = '<div class="loading">Loading…</div>';
  loadDoor().then(function(d){
    if (!d || !d.ok) { APP.innerHTML = '<div class="pad"><div class="msg err">' + esc(d ? d.msg : 'Could not load.') + '</div></div>'; return; }
    bar();
    if (h === 'shops') return pageShops();
    var m = h.match(/^shop\/(\d+)$/);
    if (m) return pageShop(Number(m[1]));
    pageDoor();
  });
}
window.addEventListener('hashchange', route);
route();
})();
</script>
